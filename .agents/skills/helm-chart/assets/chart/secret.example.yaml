# Every secret value this app needs, in one Secret — the helm-chart skill lists each key the app reads.
#   1. Copy this file to secret.yaml (never commit it: custom-deploy/.gitignore keeps it out).
#   2. Fill in every value.
#   3. kubectl apply -n <namespace> -f custom-deploy/helm/secret.yaml — before helm install.
# The install stops, naming each one, if a key the app needs is missing from it.
apiVersion: v1
kind: Secret
metadata:
  # = secrets.name in values.yaml
  name: canvas-app-secrets
type: Opaque
stringData:
  EXAMPLE_API_KEY: ""
