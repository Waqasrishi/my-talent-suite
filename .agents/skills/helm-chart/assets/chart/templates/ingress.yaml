{{- if .Values.ingress.enabled }}
{{- $middlewares := list }}
{{- if .Values.authentik.enabled }}
{{- $middlewares = append $middlewares (printf "%s-%s-authentik@kubernetescrd" .Release.Namespace (include "canvasapp.fullname" .)) }}
{{- if .Values.authentik.stripCookies }}
{{- $middlewares = append $middlewares (printf "%s-%s-cookies@kubernetescrd" .Release.Namespace (include "canvasapp.fullname" .)) }}
{{- end }}
{{- end }}
{{- if eq .Values.ingress.className "traefik" }}
{{- $middlewares = append $middlewares (printf "%s-%s-hsts@kubernetescrd" .Release.Namespace (include "canvasapp.fullname" .)) }}
{{- $middlewares = append $middlewares (printf "%s-%s-compress@kubernetescrd" .Release.Namespace (include "canvasapp.fullname" .)) }}
{{- end }}
{{- $middlewares = concat $middlewares .Values.ingress.middlewares }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "canvasapp.fullname" . }}
  labels:
    {{- include "canvasapp.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: {{ .Values.ingress.entrypoints | quote }}
    {{- with $middlewares }}
    # Sign-in first: an unsigned-in request never reaches the app.
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," . | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      {{- with .Values.ingress.tls.secretName }}
      secretName: {{ . }}
      {{- end }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Always `/`: healthPath is what the probes call, not where the app lives.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "canvasapp.fullname" . }}
                port: { name: http }
{{- end }}
