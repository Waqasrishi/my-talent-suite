{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "canvasapp.fullname" . }}
  labels:
    {{- include "canvasapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "canvasapp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - { port: http, protocol: TCP }
      from:
        {{- if .Values.ingress.enabled }}
        # The ingress controller.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
        {{- end }}
        {{- range .Values.networkPolicy.allowFrom }}
        # The release's `{{ . }}` (a pair's web app calling its API).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
              app.kubernetes.io/instance: {{ $.Release.Name }}
        {{- end }}
        # `helm test`.
        - podSelector:
            matchLabels:
              canvas.dev/helm-test: {{ include "canvasapp.fullname" . | quote }}
{{- end }}
