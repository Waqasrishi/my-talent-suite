{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "canvasapp.fullname" . }}-data
  labels:
    {{- include "canvasapp.labels" . | nindent 4 }}
  annotations:
    # Kept on `helm uninstall`: the files are the app's, not the release's.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
