apiVersion: v1
kind: Pod
metadata:
  name: {{ include "canvasapp.fullname" . }}-test-health
  labels:
    {{- include "canvasapp.labels" . | nindent 4 }}
    canvas.dev/helm-test: {{ include "canvasapp.fullname" . | quote }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: health
      image: {{ .Values.test.image | quote }}
      command: ["wget", "-q", "-O-", "http://{{ include "canvasapp.fullname" . }}:{{ .Values.port }}{{ .Values.healthPath }}"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
