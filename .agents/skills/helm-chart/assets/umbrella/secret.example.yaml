# Every secret value this pair needs, the API's and the web app's, in one Secret — the helm-chart
# skill lists each key they read.
#   1. Copy this file to secret.yaml (never commit it: custom-deploy/.gitignore keeps it out).
#   2. Fill in every value.
#   3. kubectl apply -n <namespace> -f custom-deploy/helm/secret.yaml — before helm install.
# The install stops, naming each one, if a key either part needs is missing from it.
apiVersion: v1
kind: Secret
metadata:
  # = global.secretName in values.yaml
  name: canvas-pair-secrets
type: Opaque
stringData:
  EXAMPLE_API_KEY: ""
