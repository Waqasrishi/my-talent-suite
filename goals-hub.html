<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goals Cycle Hub</title>
<style>
/* Goals Cycle Hub: goals align outbound to the goals they support and receive inbound links from goals that support them. Sample data, kept in this browser only. */
:root{--bg:#F6F7F9;--card:#fff;--ink:#16202B;--muted:#5D6B7A;--line:#E2E6EB;--accent:#0B5CAD;--accent-d:#094C8F;--accent-soft:#E8F1FB;
 --ok:#1E7B46;--ok-soft:#E6F4EC;--wait:#8A5A00;--wait-soft:#FFF4DE;--bad:#B3261E;--bad-soft:#FDECEA;--ai:#5B3FB0;--ai-soft:#F3F0FB}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.2}
h1{font-size:24px}h2{font-size:18px}h3{font-size:15px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px 18px;padding:10px 20px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600}
.nav button[aria-current]{background:var(--accent-soft);color:var(--accent)}
.sp{flex:1}
.as{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
.as select{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);max-width:240px}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 80px}
.wide{max-width:none}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head p{margin:4px 0 0;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{border-color:#C5CDD6}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-d)}
.btn.ai{background:var(--ai-soft);border-color:#D9D0F2;color:var(--ai)}
.btn.sm{padding:4px 10px;font-size:13.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0;padding-top:2px}
.steps li span{flex:1}
.rows{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr 160px 150px;gap:16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.row:first-child{border-top:0}
.row:hover{background:#FAFBFC}
.row b{display:block;font-weight:600}
.row small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.wait{background:var(--wait-soft);color:var(--wait)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.draft{background:#EEF0F3;color:var(--muted)}
.bar{height:6px;background:#E7EAEE;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.prog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.prog .bar{flex:1}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
/* drawer */
.mask{position:fixed;inset:0;background:rgba(22,32,43,.35);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh h2{flex:1}
.x{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.db{padding:18px 20px;overflow:auto;flex:1}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.meta{color:var(--muted);font-size:13.5px;margin:4px 0}
.next{background:var(--accent-soft);border-radius:10px;padding:14px;margin:16px 0}
.next h3{margin-bottom:6px}
.next p{margin:0 0 10px}
.next .btns{display:flex;gap:8px;flex-wrap:wrap}
.krs{margin:8px 0 0;padding-left:20px}
.krs li{margin:4px 0}
details{border-top:1px solid var(--line);padding:10px 0}
details summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:8px}
.hist{list-style:none;margin:0;padding:0;font-size:13.5px}
.hist li{padding:4px 0;color:var(--muted)}
.hist b{color:var(--ink);font-weight:600}
label.f{display:block;font-weight:600;margin:14px 0 6px}
label.f:first-child{margin-top:0}
.in{width:100%;border:1px solid #C9D1DA;border-radius:8px;padding:8px 10px;background:#fff}
textarea.in{min-height:70px;resize:vertical}
.in[aria-invalid=true]{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.err{color:var(--bad);font-size:13.5px;margin-top:4px;font-weight:600}
.kr{display:flex;gap:8px;margin-bottom:8px}
.kr .in{flex:1}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.aibar{background:var(--ai-soft);border-radius:10px;padding:10px 12px;margin:14px 0 4px}
.aibar .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.aibar .in{flex:1;min-width:180px}
.tag{display:inline-block;font-size:11.5px;color:var(--ai);border:1px solid #D9D0F2;background:#fff;border-radius:10px;padding:0 8px;margin-left:6px;font-weight:600;vertical-align:middle}
.sug{background:#fff;border:1px solid #E1DAF5;border-radius:8px;padding:10px 12px;margin-top:8px}
.sug b{display:block}
.sug ul{margin:6px 0;padding-left:18px;font-size:13.5px}
.sug p{margin:4px 0 8px;font-size:13px;color:var(--muted)}
.chk{list-style:none;margin:8px 0 0;padding:0}
.chk li{padding:5px 0;font-size:14px}
.chk small{display:block;color:var(--muted);font-size:13px;margin-left:22px}
.note{background:var(--wait-soft);border-radius:8px;padding:8px 12px;font-size:13.5px;margin:10px 0}
/* strategy map */
.mapwrap{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:calc(100vh - 170px)}
.map{position:relative}
.colh{position:sticky;top:0;z-index:3;display:flex;background:#fff;border-bottom:1px solid var(--line)}
.colh div{flex:none;padding:10px 14px;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.map svg{position:absolute;left:0;top:0;pointer-events:none}
.box{position:absolute;background:#fff;border:1px solid #C9D1DA;border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.box:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.box b{font-size:13.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.box small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .bar{height:4px;margin-top:auto}
.box.pillar{background:var(--accent);border-color:var(--accent);color:#fff}
.box.pillar small{color:#DCE8F6}
.box.pillar.on{box-shadow:0 0 0 3px #9CC2EA}
.box.ask{border-style:dashed;background:#FBFCFD;cursor:default}
.box.ask:hover{border-color:#C9D1DA;box-shadow:none}
.box.wait{border-color:#E3C27A}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:10px 0 0}
.legend i{display:inline-block;width:14px;height:10px;border:1px solid #C9D1DA;border-radius:3px;vertical-align:middle;margin-right:5px}
/* dashboard */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
.stat b{display:block;font-size:30px;line-height:1.1}
.stat span{color:var(--muted);font-size:13.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.lv{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.lv .bar{height:10px}
.lv em{font-style:normal;color:var(--muted);text-align:right;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--accent-soft);color:var(--accent)}
.foot{color:var(--muted);font-size:13px;text-align:center;padding:20px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:8px;padding:10px 16px;z-index:60;max-width:90vw}
@media(max-width:760px){.row{grid-template-columns:1fr;gap:8px}.stats,.two{grid-template-columns:1fr}.lv{grid-template-columns:110px 1fr 60px}.top{padding:10px 16px}}
/* alignment */
.al{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.links{list-style:none;margin:8px 0 0;padding:0}
.links li{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 10px;padding:8px 0;border-top:1px dashed var(--line)}
.links li:first-child{border-top:0}
.dir{font-weight:700;color:var(--accent);width:16px;flex:none}
.lt{flex:1;min-width:0}.lt b{display:block;font-weight:600}.lt small{display:block;color:var(--muted);font-size:12.5px}.lt .link{text-align:left}
.la{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rs{font-style:italic}
.prim{color:var(--accent);font-weight:600}
.dec{flex-basis:100%;display:flex;gap:8px;flex-wrap:wrap;padding-left:26px}.dec .in{flex:1;min-width:150px;padding:4px 8px}
.addl{background:#FAFBFC;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px}.addl .btns{display:flex;gap:8px}
.flag{color:var(--bad);font-weight:600}
.io{color:var(--muted)}
.ln{fill:none;stroke:#B9C3CE;stroke-width:1.5}.ln.x{stroke:#5A8FD0;stroke-dasharray:6 4}.ln.pend{stroke-dasharray:2 4}.ln.x.pend{stroke:#9DBBE3}
.box.loose{border-color:var(--bad)}
.bandh{position:absolute;left:16px;font-size:12px;font-weight:700;color:var(--bad);text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
/* ---------- sample organisation: fictional people in two departments ---------- */
const LEVELS=['Corporate strategy','Executive Directors','Directors','Managers','Section Heads','Staff'];
const PEOPLE={
 ed1:{name:'Omar Rahman',title:'Executive Director, Operations',lv:1,mgr:null,dept:'Operations'},
 ed2:{name:'Sara Nasser',title:'Executive Director, Digital',lv:1,mgr:null,dept:'Digital'},
 d1:{name:'Marco Silva',title:'Director, Studio Operations',lv:2,mgr:'ed1',dept:'Operations'},
 d2:{name:'Hana Yousef',title:'Director, Digital Products',lv:2,mgr:'ed2',dept:'Digital'},
 m1:{name:'Daniel Okafor',title:'Manager, Broadcast Engineering',lv:3,mgr:'d1',dept:'Operations'},
 m2:{name:'Rana Aziz',title:'Manager, Studio Production',lv:3,mgr:'d1',dept:'Operations'},
 m3:{name:'Leo Martins',title:'Manager, Audience Growth',lv:3,mgr:'d2',dept:'Digital'},
 s1:{name:'Nadia Karim',title:'Section Head, Playout',lv:4,mgr:'m1',dept:'Operations'},
 s2:{name:'Yusuf Ali',title:'Section Head, Studio Crew',lv:4,mgr:'m2',dept:'Operations'},
 t1:{name:'Mei Chen',title:'Broadcast Engineer',lv:5,mgr:'s1',dept:'Operations'},
 t2:{name:'Tomas Ruiz',title:'Playout Technician',lv:5,mgr:'s1',dept:'Operations'},
 t3:{name:'Aisha Bello',title:'Floor Manager',lv:5,mgr:'s2',dept:'Operations'},
 t4:{name:'Priya Nair',title:'Audience Analyst',lv:5,mgr:'m3',dept:'Digital'}};
const KEY='ajmn-goals-hub-v2',TODAY=new Date().toISOString().slice(0,10);
function seed(){
 const g=(id,owner,title,krs,x)=>Object.assign({id,owner,title,desc:'',krs:krs.map(t=>({t})),status:'approved',progress:0,back:'',updates:[],hist:[{at:'2026-01-15',by:owner,w:'Goal approved'}]},x||{});
 const l=(id,from,to,status,primary)=>({id,from,to,status,primary:!!primary,at:'2026-02-01',reason:''});
 return {as:'d1',seq:100,
  pillars:[{id:'p1',name:'Grow trusted digital audiences'},{id:'p2',name:'Operational excellence'},{id:'p3',name:'Invest in our people'}],
  goals:[
   g('g1','ed1','Cut unplanned studio downtime across all channels',['Unplanned downtime below 30 minutes a month by Q4','Mean time to restore under 15 minutes'],{progress:40}),
   g('g2','ed2','Double weekly active users on digital platforms',['Weekly active users from 1.2M to 2.4M by December','Returning visitors up 30%'],{progress:25}),
   g('g3','ed1','Build a skilled, adaptable operations workforce',['Every operations employee completes two learning paths','Internal moves fill 30% of open roles'],{progress:15}),
   g('g4','d1','Keep studio service levels above 99.5%',['Studio availability at 99.5% or better every month','No live show lost to a studio fault'],{progress:50}),
   g('g5','d2','Launch a personalised homepage in three markets',['Live in 3 markets by Q3','Click-through on recommendations above 8%'],{progress:30}),
   g('g9','d2','Publish breaking stories within 10 minutes',['90% of breaking stories live within 10 minutes','Median filing-to-publish time under 20 minutes'],{progress:45}),
   g('g6','m1','Keep playout incidents under three a month',['Playout incidents at most 3 a month','All incidents reviewed within 5 working days'],{progress:55}),
   g('g7','m3','Grow newsletter sign-ups by 40%',['Sign-ups from 50k to 70k by Q4','Welcome series open rate above 45%'],{status:'submitted',hist:[{at:'2026-11-10',by:'m3',w:'Submitted for approval'}]}),
   g('g8','t4','Build audience dashboards for the studio team',['Weekly studio audience dashboard live by Q2','Used in 4 of 5 weekly planning meetings'],{progress:35}),
   g('g10','s1','Cut playout recovery time to under 15 minutes',['Median recovery under 15 minutes by Q3'],{progress:20}),
   g('g11','t1','Automate playout health checks',['Automated checks on 100% of playout servers by Q2'],{progress:30}),
   g('g12','m2','Reduce studio changeover time to 20 minutes',['Average changeover under 20 minutes by Q3'],{progress:10})],
  links:[l('l1','g1','p2','accepted',1),l('l2','g2','p1','accepted',1),l('l3','g3','p3','accepted',1),l('l4','g4','g1','accepted',1),l('l5','g5','g2','accepted',1),l('l6','g9','g2','accepted',1),
   l('l7','g6','g4','accepted',1),l('l8','g7','g5','pending',1),l('l9','g8','g5','accepted',1),l('l10','g8','g4','pending'),l('l11','g4','g9','pending'),l('l12','g10','g6','accepted',1),l('l13','g11','g10','accepted',1)]};
}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(x){}
if(!S||!S.goals||!S.links||!PEOPLE[S.as])S=seed();
const U={page:'mine',dr:null,form:null,ai:null,err:{},scope:'all',add:null,saveErr:false};
/* storage can fail (private mode, quota): say so instead of losing changes silently */
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));U.saveErr=false}catch(x){if(!U.saveErr){U.saveErr=true;setTimeout(render)}}};
/* another tab changed the data: take its copy, so this tab's next save does not overwrite it */
window.addEventListener('storage',ev=>{if(ev.key!==KEY||!ev.newValue)return;try{const n=JSON.parse(ev.newValue);if(n&&n.goals&&n.links){S=n;if(U.dr&&U.dr.k==='goal'&&!G(U.dr.id))U.dr=null;render();toast('Updated with changes from another tab')}}catch(x){}});

/* ---------- helpers ---------- */
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=id=>PEOPLE[id],ME=()=>S.as,G=id=>S.goals.find(g=>g.id===id),PL=id=>S.pillars.find(p=>p.id===id),LK=id=>S.links.find(l=>l.id===id);
const isPillar=id=>!!PL(id);
const reports=id=>Object.keys(PEOPLE).filter(k=>PEOPLE[k].mgr===id);
const below=id=>reports(id).flatMap(r=>[r,...below(r)]);
const fmt=d=>d?new Date(d+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const hist=(g,w)=>g.hist.push({at:TODAY,by:ME(),w});
const who=id=>`${P(id).name}${P(id).dept!==P(ME()).dept?' ('+P(id).dept+')':''}`;
const nodeName=id=>isPillar(id)?PL(id).name:G(id)?G(id).title:'';
const nodeOwner=id=>isPillar(id)?null:G(id)&&G(id).owner;
const STATUS={draft:['Draft','draft'],submitted:['Waiting for approval','wait'],approved:['Approved','ok'],returned:['Sent back','bad']};
const LST={pending:['Pending','wait'],accepted:['Accepted','ok'],rejected:['Rejected','bad']};
const pill=s=>`<span class="pill ${STATUS[s][1]}">${STATUS[s][0]}</span>`,lpill=s=>`<span class="pill ${LST[s][1]}">${LST[s][0]}</span>`;
const prog=(n,g)=>g&&!g.updates.length&&!n?`<div class="prog"><div class="bar"></div>No update yet</div>`:`<div class="prog"><div class="bar"><i style="width:${n}%"></i></div>${n}%</div>`;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}

/* ---------- alignment: outbound = links from a goal, inbound = links to it ---------- */
const canSee=g=>!!g&&(g.status!=='draft'||g.owner===ME());
const out=g=>S.links.filter(l=>l.from===g.id);
const inb=g=>S.links.filter(l=>l.to===g.id&&canSee(G(l.from)));
const primary=g=>out(g).find(l=>l.primary&&l.status!=='rejected');
/* the path to strategy follows accepted primary links only, so each goal counts once */
function path(g){const c=[];let x=g,ok=true;for(let i=0;i<20;i++){const l=primary(x);if(!l)return {pillar:null,chain:c,ok:false};if(l.status!=='accepted')ok=false;if(isPillar(l.to))return {pillar:l.to,chain:c,ok};x=G(l.to);if(!x)return {pillar:null,chain:c,ok:false};c.unshift(x)}return {pillar:null,chain:c,ok:false}}
const aligned=g=>{const p=path(g);return p.ok&&!!p.pillar};
const rootPillar=g=>{const p=path(g);return p.ok?p.pillar:null};
/* goals that already support this one, directly or further down: linking to any of them would close a loop.
   Targets are goals of people at the same level or above. */
function supporters(id){const seen=new Set(),st=[id];while(st.length){const x=st.pop();S.links.forEach(l=>{if(l.to===x&&l.status!=='rejected'&&!seen.has(l.from)){seen.add(l.from);st.push(l.from)}})}return seen}
function targets(g){const mgr=P(g.owner).mgr,sup=supporters(g.id),taken=new Set(out(g).filter(l=>l.status!=='rejected').map(l=>l.to));
 const gs=S.goals.filter(x=>x.status==='approved'&&x.owner!==g.owner&&x.id!==g.id&&!sup.has(x.id)&&!taken.has(x.id)&&P(x.owner).lv<=P(g.owner).lv);
 return {mine:gs.filter(x=>x.owner===mgr),other:gs.filter(x=>x.owner!==mgr),pillars:P(g.owner).lv===1?S.pillars.filter(p=>!taken.has(p.id)):[]}}
const validTarget=(g,to)=>{const t=targets(g);return [...t.mine,...t.other,...t.pillars].some(x=>x.id===to)};

/* ---------- every action is checked here, not only by hiding its button ---------- */
const may={approve:g=>g.status==='submitted'&&P(g.owner).mgr===ME(),sendback:g=>g.status==='submitted'&&P(g.owner).mgr===ME(),
 edit:g=>g.owner===ME()&&(g.status==='draft'||g.status==='returned'),delete:g=>g.owner===ME()&&g.status==='draft',
 progress:g=>g.status==='approved'&&g.owner===ME(),align:g=>g.owner===ME(),
 decide:l=>nodeOwner(l.to)===ME()&&canSee(G(l.from)),withdraw:l=>G(l.from)&&G(l.from).owner===ME()};
const denied=()=>toast('You cannot do that on this goal.');
const canEditStrategy=()=>P(ME()).lv===1;
function propose(g,to){if(!may.align(g)||!validTarget(g,to))return false;const first=!primary(g),pillar=isPillar(to);
 S.links.push({id:'l'+(S.seq++),from:g.id,to,status:pillar?'accepted':'pending',primary:first,at:TODAY,reason:''});
 hist(g,`Aligned to “${nodeName(to)}”${pillar?'':' (waiting for '+P(nodeOwner(to)).name+')'}`);if(!pillar)hist(G(to),`${P(g.owner).name} asked to align “${g.title}” to this goal`);return true}

function nextSteps(){const me=ME(),r=[],my=S.goals.filter(g=>g.owner===me);
 my.forEach(g=>inb(g).filter(l=>l.status==='pending'&&G(l.from).status!=='draft').forEach(l=>{const f=G(l.from);r.push({t:`${who(f.owner)} wants “${f.title}” to support your goal “${g.title}”.`,b:'Review',id:g.id,pri:1})}));
 S.goals.filter(g=>g.status==='submitted'&&P(g.owner).mgr===me).forEach(g=>r.push({t:`${P(g.owner).name} submitted “${g.title}” for your approval.`,b:'Review',id:g.id,pri:1}));
 my.filter(g=>g.status==='draft'||g.status==='returned').forEach(g=>r.push({t:g.status==='returned'?`“${g.title}” was sent back${g.back?': '+g.back:''}.`:`“${g.title}” is still a draft.`,b:'Finish and submit',id:g.id,edit:1,pri:1}));
 my.forEach(g=>out(g).filter(l=>l.status==='rejected').forEach(l=>r.push({t:`${P(nodeOwner(l.to)).name} declined to align “${g.title}” to “${nodeName(l.to)}”${l.reason?': '+l.reason:''}.`,b:'Open',id:g.id})));
 my.filter(g=>g.status==='approved'&&!primary(g)).forEach(g=>r.push({t:`“${g.title}” is not aligned to strategy.`,b:'Align it',id:g.id}));

function layout(){const W=210,H=74,CW=260,RH=90,TOP=46,nodes=[],tree=[];let row=0;const vis=S.goals.filter(g=>g.status!=='draft'),placed=new Set();
 const kids=id=>vis.filter(g=>{const p=primary(g);return p&&p.to===id}).map(g=>({k:'g',id:g.id,lv:P(g.owner).lv}));
 const place=n=>{if(n.k==='g')placed.add(n.id);const ks=n.k==='u'?[]:kids(n.id).filter(c=>!placed.has(c.id));let y;if(!ks.length)y=row++;else{const ys=ks.map(c=>{tree.push([n,c]);return place(c)});y=(ys[0]+ys[ys.length-1])/2}n.y=y;nodes.push(n);return y};
 S.pillars.forEach(p=>{place({k:'p',id:p.id,lv:0});row+=.35});
 const loose=vis.filter(g=>!placed.has(g.id)&&!primary(g));let band=null;if(loose.length){row+=.4;band=row;loose.forEach(g=>place({k:'g',id:g.id,lv:P(g.owner).lv}))}
 const rest=vis.filter(g=>!placed.has(g.id));rest.forEach(g=>place({k:'g',id:g.id,lv:P(g.owner).lv}));
 nodes.forEach(n=>{n.x=16+n.lv*CW;n.top=TOP+12+n.y*RH});const at=id=>nodes.find(n=>n.id===id);
 const extra=S.links.filter(l=>!l.primary&&l.status!=='rejected'&&at(l.from)&&at(l.to)).map(l=>[at(l.to),at(l.from),l]);
 return {nodes,tree,extra,band:band==null?null:TOP+12+band*RH-26,W,H,CW,width:16+LEVELS.length*CW,height:TOP+24+Math.max(row,1)*RH}}
function pageMap(){const L=layout();
 const box=n=>{const st=`left:${n.x}px;top:${n.top}px;width:${L.W}px;height:${L.H}px`;
  if(n.k==='p'){const p=PL(n.id);return `<button class="box pillar" style="${st}" data-a="pillar" data-id="${p.id}"><small>Pillar</small><b>${e(p.name)}</b></button>`}
  const g=G(n.id),pr=primary(g);return `<button class="box ${g.status!=='approved'?'wait':''} ${!pr?'loose':''}" style="${st}" data-a="open" data-id="${g.id}"><b>${e(g.title)}</b><small>${e(P(g.owner).name)} · ${e(P(g.owner).dept)}${g.status!=='approved'?' · '+STATUS[g.status][0]:''}</small><div class="bar"><i style="width:${g.progress}%"></i></div></button>`};
 const curve=(a,b,cls)=>{const x1=a.x+L.W,y1=a.top+L.H/2,x2=b.x,y2=b.top+L.H/2,m=(x1+x2)/2;return `<path d="M${x1} ${y1} C${m} ${y1} ${m} ${y2} ${x2} ${y2}" class="${cls}"/>`};
 const pl=l=>l.status==='pending'?'pend':'';
 return `<div class="wrap wide"><div class="head"><div><h1>Strategy map</h1><p>Pillars to staff, left to right. Grey lines are each goal’s main alignment; blue dashed lines are extra links, often across departments. Dotted lines are waiting to be accepted.</p></div></div>
 <div class="mapwrap"><div class="map" style="width:${L.width}px;height:${L.height}px"><div class="colh" style="width:${L.width}px">${LEVELS.map(l=>`<div style="width:${L.CW}px">${l}</div>`).join('')}</div>
 <svg width="${L.width}" height="${L.height}" aria-hidden="true">${L.tree.map(([a,b])=>curve(a,b,'ln '+(b.k==='g'?pl(primary(G(b.id))):''))).join('')}${L.extra.map(([a,b,l])=>curve(a,b,'ln x '+pl(l))).join('')}</svg>
 ${L.band!=null?`<div class="bandh" style="top:${L.band}px">Not aligned to strategy</div>`:''}${L.nodes.map(box).join('')}</div></div>
 <div class="legend"><span><i style="background:var(--accent);border-color:var(--accent)"></i>Pillar</span><span><i></i>Approved goal</span><span><i style="border-color:#E3C27A"></i>Waiting for approval</span><span><i style="border-color:var(--bad)"></i>Not aligned</span><span>Drafts are not shown.</span></div></div>`}

function readForm(t){const f=U.form,k=t.dataset.ff;if(!f||!k)return;if(k==='kr')f.krs[+t.dataset.i]=t.value;else f[k]=t.value}
function saveForm(draft){const f=U.form,me=ME(),g0=f.id&&G(f.id),krs=f.krs.map(x=>x.trim()).filter(Boolean),title=f.title.trim(),err={};
 if(g0&&!may.edit(g0)){U.dr=U.form=null;render();return denied()}
 if(!title)err.title='Add a goal.';if(!krs.length&&!draft)err.krs='Add at least one key result.';
 if(!g0&&(!f.to||!validTarget({id:'_new',owner:me},f.to)))err.to='Choose a goal or pillar from the list.';
 U.err=err;if(Object.keys(err).length){render();const x=document.querySelector('[aria-invalid=true]');if(x)x.focus();return}
 let g=g0;if(!g){g={id:'g'+(S.seq++),owner:me,title,desc:'',krs:[],status:'draft',progress:0,back:'',updates:[],hist:[]};S.goals.push(g);hist(g,'Created');propose(g,f.to)}
 Object.assign(g,{title,desc:f.desc.trim(),krs:krs.map(t=>({t}))});
 if(draft){hist(g,'Saved as draft');toast('Draft saved')}else{submitGoal(g);if(g.status==='approved')acceptOwnLinks(g);toast(g.status==='approved'?'Goal saved':'Submitted to '+P(P(g.owner).mgr).name)}
 U.form=U.ai=null;U.dr={k:'goal',id:g.id};render()}
/* approving a goal also accepts its links to the approver's own goals */
function acceptOwnLinks(g){out(g).filter(l=>l.status==='pending'&&nodeOwner(l.to)===ME()).forEach(l=>{l.status='accepted';hist(G(l.to),`Accepted “${g.title}” as support`)})}

/* ---------- AI goal design: scripted in this sandbox ---------- */
const LIB={
 p1:[['Grow the {a} audience on digital platforms',['Weekly active users up 20% by Q4','Returning visitors up 15% by December'],'more people reaching our journalism every week'],
  ['Make {a} content easier to find',['Search click-through above 30% by Q3','Average time to first click under 8 seconds'],'more visits that turn into regular use'],
  ['Publish {a} stories faster',['Median time from filing to publishing under 20 minutes','90% of breaking stories live within 10 minutes'],'audiences coming to us first']],
 p2:[['Reduce unplanned outages in {a}',['Unplanned outage minutes below 30 a month by Q4','Mean time to restore under 15 minutes'],'less downtime across the channels'],
  ['Standardise maintenance across {a}',['Preventive maintenance done on 95% of schedule','Zero repeat faults on the same equipment within 30 days'],'fewer failures before they happen'],
  ['Strengthen fault handling in {a}',['100% of the team trained on the fault runbook by Q2','Two fault drills held every quarter'],'faster, calmer recovery when something breaks']],
 p3:[['Build core skills across {a}',['Every team member completes two learning paths by Q4','Skills gaps in the team plan reduced by half'],'a workforce ready for new formats'],
  ['Grow future leaders in {a}',['Two successors named for each key role','Four internal moves or stretch assignments this year'],'more roles filled from inside'],
  ['Make {a} a place people stay',['Voluntary turnover below 8%','Engagement score up 5 points in the next survey'],'keeping the skills we invest in']]};
function aiSuggest(){const f=U.form,me=ME(),to=f.id?(primary(G(f.id))||{}).to:f.to,tg=to&&!isPillar(to)?G(to):null,pl=tg?(rootPillar(tg)||'p2'):(to||'p2'),area=(P(me).title.split(',')[1]||P(me).title).trim(),own=S.goals.filter(g=>g.owner===me).map(g=>g.title.toLowerCase());
 const lv=P(me).lv,scope=lv>=5?' (your own work)':lv===4?' (your section)':'',above=tg?tg.title:PL(pl).name;let items=(LIB[pl]||LIB.p2).map(([t,k,w])=>({title:t.replace('{a}',area)+scope,krs:k,why:`Supports “${above}” through ${w}.`}));
 const h=f.hint.trim();if(h)items=[{title:`${h[0].toUpperCase()+h.slice(1)} in ${area}`,krs:items[0].krs,why:`Built from your priority “${h}”. Supports “${above}”.`},...items.slice(0,2)];
 return items.filter(s=>!own.includes(s.title.toLowerCase())).slice(0,3)}
function aiReview(){const f=U.form,t=f.title.trim(),krs=f.krs.map(x=>x.trim()).filter(Boolean),lv=P(ME()).lv,c=[];
 const act=/^(attend|hold|do|work on|help|support|participate|join|try|complete training|be )/i.test(t);
 c.push(!t?{ok:false,label:'There is no goal yet',tip:'Start with the result you want, not the task.'}:act?{ok:false,label:'Reads as an activity, not an outcome',tip:'Say what will be different when it is done, for example “Cut … to …”.'}:{ok:true,label:'Reads as an outcome'});
 const vague=krs.filter(k=>!/\d|%/.test(k));c.push(!krs.length?{ok:false,label:'No key results yet',tip:'Add one to three measurable key results.'}:vague.length?{ok:false,label:`${vague.length} key result(s) have no number, percentage or date`,tip:'For example: “… from 50k to 70k by Q4”.'}:{ok:true,label:'Key results are measurable'});
 if(krs.length>3)c.push({ok:false,label:'More than three key results',tip:'Keep the ones that matter most.'});
 c.push(lv>=4&&/all channels|whole network|company-wide|across the network|every market/i.test(t)?{ok:false,label:'The scope looks too wide for your level',tip:'Narrow it to what your section or your own work controls.'}:{ok:true,label:'Scope fits your level'});
 const to=f.id?(primary(G(f.id))||{}).to:f.to;c.push(to?{ok:true,label:'Supports “'+nodeName(to)+'”'}:{ok:false,label:'Not aligned to a goal above',tip:'Choose what it supports.'});
 const words=s=>new Set(s.toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3)),tw=words(t),dup=S.goals.find(g=>g.owner===ME()&&g.id!==f.id&&tw.size&&[...words(g.title)].filter(w=>tw.has(w)).length/tw.size>=.5);
 c.push(dup?{ok:false,label:'Overlaps a goal you already have',tip:'“'+dup.title+'”'}:{ok:true,label:'No overlap with your other goals'});return c}

/* ---------- drawer: pillar ---------- */
function drawerPillar(p){const gs=S.links.filter(l=>l.to===p.id).map(l=>G(l.from)).filter(canSee),ed=canEditStrategy();
 return `<div class="dh"><div style="flex:1"><span class="pill ok">Pillar</span><h2 style="margin-top:8px">${e(p.name)}</h2></div><button class="x" data-a="close" aria-label="Close">×</button></div><div class="db">
 ${ed?`<label class="f" for="pname">Pillar name</label><div style="display:flex;gap:8px"><input class="in" id="pname" value="${e(p.name)}" maxlength="120"><button class="btn" data-a="prename" data-id="${p.id}">Save</button></div>
 <div class="next"><h3>Add a goal under this pillar</h3><p>It becomes one of your goals as ${e(P(ME()).title)}.</p><button class="btn pri" data-a="pgoal" data-id="${p.id}">Add a goal</button></div>`:`<p class="muted">Pillars are managed by the Executive Directors.</p>`}
 <h3 style="margin-top:14px">Goals aligned to it (${gs.length})</h3><ul class="hist">${gs.map(g=>`<li><b>${e(P(g.owner).name)}</b> · <button class="link" data-a="open" data-id="${g.id}">${e(g.title)}</button></li>`).join('')||'<li>None yet.</li>'}</ul>
 ${ed?`<details><summary>Add a pillar</summary><div style="display:flex;gap:8px"><input class="in" id="pnew" maxlength="120" placeholder="Pillar name"><button class="btn" data-a="padd">Add</button></div></details>`:''}</div>`}

/* ---------- render ---------- */
function render(){const me=ME(),dr=U.dr,was=!!document.querySelector('.drawer'),af=document.activeElement,keep=af&&af.closest&&af.closest('.drawer')&&af.dataset&&af.dataset.ff?{ff:af.dataset.ff,i:af.dataset.i}:null;
 const nav=[['mine','My goals'],['map','Strategy map'],['dash','Dashboard']];
 const page=U.page==='map'?pageMap():U.page==='dash'?pageDash():pageMine();
 let d='';if(dr){const inner=dr.k==='form'?drawerForm():dr.k==='pillar'&&PL(dr.id)?drawerPillar(PL(dr.id)):dr.k==='goal'&&canSee(G(dr.id))?drawerGoal(G(dr.id)):'';if(inner)d=`<div class="mask" data-a="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Details" tabindex="-1">${inner}</aside>`;else U.dr=null}
 document.getElementById('app').innerHTML=`<header class="top"><div class="brand">Goals Cycle Hub<small>Sample data · fictional people</small></div><nav class="nav" aria-label="Pages">${nav.map(([k,l])=>`<button data-a="page" data-p="${k}" ${U.page===k?'aria-current="page"':''}>${l}</button>`).join('')}</nav><span class="sp"></span>
 <label class="as">Viewing as <select data-a="as">${Object.keys(PEOPLE).map(k=>`<option value="${k}" ${k===me?'selected':''}>${e(P(k).name)} · ${e(LEVELS[P(k).lv].replace(/s$/,''))}, ${e(P(k).dept)}</option>`).join('')}</select></label><button class="btn sm" data-a="reset">Reset</button></header>
 ${U.saveErr?'<div class="wrap" style="padding-bottom:0"><div class="note" role="alert">Changes could not be saved in this browser. They will be lost when you reload. Check that site data is allowed, then try again.</div></div>':''}${page}<div class="foot"><a href="./">Talent Suite</a> · <a href="strategy.html">Strategy Room</a> · <a href="successfactors.html">SuccessFactors replica</a> · Data stays in this browser.</div>${d}`;
 const dw=document.querySelector('.drawer');
 if(dw&&keep){const x=dw.querySelector(`[data-ff="${keep.ff}"]${keep.i!=null?`[data-i="${keep.i}"]`:''}`);if(x)x.focus()}
 else if(dw&&!was)(dw.querySelector('.dh .x')||dw).focus();
 else if(!dw&&was&&U.opener){const o=document.querySelector(U.opener);if(o)o.focus()}
 save()}

/* ---------- events ---------- */
const A={
 page:el=>{U.page=el.dataset.p;U.dr=null;render();window.scrollTo(0,0)},
 reset:()=>{if(!confirm('Reset the hub to the sample data? Everything entered here is cleared.'))return;S=seed();U.dr=U.form=null;render();toast('Sample data restored')},
 open:el=>{if(!canSee(G(el.dataset.id)))return denied();U.dr={k:'goal',id:el.dataset.id};U.form=null;U.add=null;render()},
 close:()=>{U.dr=U.form=U.ai=U.add=null;render()},
 new:()=>openForm({}),
 edit:el=>{const g=G(el.dataset.id);if(!g||!may.edit(g))return denied();openForm({id:g.id,title:g.title,krs:g.krs.length?g.krs.map(k=>k.t):[''],desc:g.desc})},
 delete:el=>{const g=G(el.dataset.id);if(!g||!may.delete(g))return denied();if(!confirm('Delete this draft?'))return;S.goals=S.goals.filter(x=>x!==g);S.links=S.links.filter(l=>l.from!==g.id&&l.to!==g.id);U.dr=null;render();toast('Draft deleted')},
 approve:el=>{const g=G(el.dataset.id);if(!g||!may.approve(g))return denied();g.status='approved';g.back='';hist(g,'Approved');acceptOwnLinks(g);render();toast('Approved')},
 sendback:el=>{const g=G(el.dataset.id);if(!g||!may.sendback(g))return denied();const t=document.getElementById('backmsg'),m=t.value.trim();if(!m){t.setAttribute('aria-invalid','true');t.focus();toast('Say what to change before sending it back');return}g.status='returned';g.back=m;hist(g,'Sent back: '+m);render();toast('Sent back to '+P(g.owner).name)},
 addlink:el=>{U.add=el.dataset.id;render();const s=document.getElementById('ato');if(s)s.focus()},
 addcancel:()=>{U.add=null;render()},
 propose:el=>{const g=G(el.dataset.id),to=document.getElementById('ato').value;if(!g||!may.align(g))return denied();if(!propose(g,to)){toast('That link is not allowed. It would point to your own goal or close a loop.');return}U.add=null;render();toast(isPillar(to)?'Aligned to the pillar':'Link sent to '+P(nodeOwner(to)).name)},
 accept:el=>{const l=LK(el.dataset.id);if(!l||!may.decide(l)||l.status!=='pending')return denied();l.status='accepted';hist(G(l.to),`Accepted “${G(l.from).title}” as support`);hist(G(l.from),`${P(ME()).name} accepted the link to “${nodeName(l.to)}”`);render();toast('Link accepted')},
 reject:el=>{const l=LK(el.dataset.id);if(!l||!may.decide(l)||l.status==='rejected')return denied();const t=document.getElementById('why-'+l.id),r=t.value.trim();if(!r){t.setAttribute('aria-invalid','true');t.focus();toast('Give a reason so the owner knows what to change');return}
  const was=l.status;l.status='rejected';l.reason=r;hist(G(l.to),`${was==='pending'?'Rejected':'Removed'} “${G(l.from).title}”: ${r}`);hist(G(l.from),`${P(ME()).name} ${was==='pending'?'rejected':'removed'} the link to “${nodeName(l.to)}”: ${r}`);render();toast(was==='pending'?'Link rejected':'Link removed')},
 withdraw:el=>{const l=LK(el.dataset.id);if(!l||!may.withdraw(l))return denied();const g=G(l.from);S.links=S.links.filter(x=>x!==l);hist(g,`Removed the link to “${nodeName(l.to)}”`);promote(g);render();toast('Link removed')},
 primary:el=>{const l=LK(el.dataset.id);if(!l||!may.withdraw(l)||l.status==='rejected')return denied();out(G(l.from)).forEach(x=>x.primary=false);l.primary=true;hist(G(l.from),`Main alignment set to “${nodeName(l.to)}”`);render();toast('Main alignment changed')},
 progress:el=>{const g=G(el.dataset.id);if(!g||!may.progress(g))return denied();const v=+document.getElementById('pval').value,n=document.getElementById('pnote').value.trim();g.progress=v;g.updates.push({at:TODAY,by:ME(),pct:v,note:n});hist(g,'Progress set to '+v+'%');render();toast('Progress saved')},
 fsave:el=>saveForm(!!el.dataset.d),
 kradd:()=>{U.form.krs.push('');render();const x=document.querySelectorAll('[data-ff=kr]');x[x.length-1].focus()},
 krdel:el=>{U.form.krs.splice(+el.dataset.i,1);render()},
 aisuggest:()=>{U.ai={kind:'suggest',items:aiSuggest()};render()},
 aireview:()=>{U.ai={kind:'review',checks:aiReview()};render()},
 aiuse:el=>{const s=U.ai.items[+el.dataset.i];U.form.title=s.title;U.form.krs=s.krs.slice();U.ai=null;U.err={};render();toast('Filled in. Change anything before you submit.')},
 aiclose:()=>{U.ai=null;render()},
 pillar:el=>{U.dr={k:'pillar',id:el.dataset.id};render()},
 prename:el=>{if(!canEditStrategy())return denied();const v=document.getElementById('pname').value.trim();if(!v)return;PL(el.dataset.id).name=v;render();toast('Pillar renamed')},
 padd:()=>{if(!canEditStrategy())return denied();const v=document.getElementById('pnew').value.trim();if(!v)return;S.pillars.push({id:'p'+(S.seq++),name:v});render();toast('Pillar added')},
 pgoal:el=>{if(!canEditStrategy())return denied();openForm({to:el.dataset.id})},
 scope:el=>{U.scope=el.dataset.s;render()}};
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el||el.tagName==='SELECT')return;const f=A[el.dataset.a];if(f){ev.preventDefault();if(!document.querySelector('.drawer')&&el.tagName==='BUTTON')U.opener=`[data-a="${el.dataset.a}"]`+(el.dataset.id?`[data-id="${el.dataset.id}"]`:'')+(el.dataset.p?`[data-p="${el.dataset.p}"]`:'');f(el,ev)}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='pval')document.getElementById('pout').textContent=t.value+'%';if(t.getAttribute('aria-invalid')&&t.value)t.removeAttribute('aria-invalid');if(t.dataset.ff)readForm(t)});
document.addEventListener('change',ev=>{const t=ev.target;if(t.dataset.a==='as'){S.as=t.value;U.dr=U.form=U.ai=U.add=null;render();toast('Viewing as '+P(t.value).name)}else if(t.dataset.ff)readForm(t)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&U.dr){U.dr=U.form=U.ai=U.add=null;render();return}
 const dw=document.querySelector('.drawer');if(ev.key==='Tab'&&dw){const f=[...dw.querySelectorAll('button,input,select,textarea,summary,[href]')].filter(x=>!x.disabled&&x.offsetParent!==null);if(!f.length)return;
  if(ev.shiftKey&&(document.activeElement===f[0]||!dw.contains(document.activeElement))){ev.preventDefault();f[f.length-1].focus()}else if(!ev.shiftKey&&document.activeElement===f[f.length-1]){ev.preventDefault();f[0].focus()}}});
render();
</script>
