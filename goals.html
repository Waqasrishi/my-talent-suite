<style>

.opt .t{display:flex;align-items:flex-start;gap:8px;flex-wrap:nowrap}.opt .inl{display:block;resize:none;overflow:hidden;flex:1 1 0;min-width:0;font:inherit;font-weight:700;color:#1D2250;background:transparent;border:0;border-bottom:2px solid #D89E11;border-radius:0;padding:0 0 2px;min-height:0;height:auto;line-height:1.4}.opt .inl:focus{outline:none;border-bottom-color:#D89E11;border-bottom-style:solid}.owncap{font-size:12.5px;font-weight:700;color:#8C8FA8;letter-spacing:.02em}.opt .inl.own{margin:0;width:100%;box-sizing:border-box;font-size:17px}.opt{min-height:82px;box-sizing:border-box;position:relative}.opt .rec{position:absolute;top:-11px;right:16px;margin:0}.opt.ownrow{align-items:center}.opt.ownrow input[type=radio]{margin:0}
.ta{margin:8px 0 0;border:1.5px solid #DADCEA;border-radius:12px;background:#fff;padding:6px;box-shadow:0 8px 24px rgba(33,45,102,.12)}.ta[hidden]{display:none}.tah{font-size:12px;font-weight:700;color:var(--muted);padding:4px 8px}.tao{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:9px 10px;font:inherit;font-size:14.5px;color:#1D2250;cursor:pointer;min-height:44px}.tao:hover,.tao:focus{background:#FBF0D2;outline:none}
.opt .pen{color:#8C8FA8;font-size:15px;flex:none;line-height:1.5}

input[type=text],textarea,input[type=date]{width:100%;border:2px solid #DADCEA;border-radius:12px;padding:10px 12px;font:inherit;margin-top:8px;color:var(--ink)}

input[type=text]:not(.inl):focus-visible,textarea:not(.inl):focus-visible,input[type=date]:focus-visible,select:focus-visible{outline:none}

.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero{background:var(--grad);color:#fff}
.hero .brand{color:#fff}.hero .brand span{color:#F3DC9A}.hero #crumb{color:rgba(255,255,255,.85)!important}
.hero .who{color:rgba(255,255,255,.9)}
.hero select{background:rgba(255,255,255,.95);border-color:transparent;border-radius:10px}

#hero{padding-top:18px;padding-bottom:84px}

body.wide .wrap{max-width:1380px}
.an{position:absolute;border-radius:14px;padding:8px 14px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.an b{font-size:14px;line-height:1.25;font-weight:800}.an small{font-size:12.5px;line-height:1.3;opacity:.85;margin-top:2px}.an{padding-right:64px}.an b{font-size:13px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.an small{font-size:12px}.an .ring{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:48px;height:48px}.an .ring svg{position:absolute;left:0;top:0}.an .ring i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11.5px;font-weight:800}
.an.s{background:#212D66;color:#fff}
.an.m{background:#fff;border:2px solid #DADCEA;color:#1D2250}
.an.g{background:#FBF0D2;border:2px solid #212D66;color:#1D2250}.an.c{background:#fff;border:2px dashed #D89E11;color:#1D2250}.an .ring.inv{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#5F4300;background:var(--tint);border-radius:50%;width:48px;height:48px}
.an.e{border:2px dashed #B9BDD6;color:var(--muted);align-items:center}
.g2{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:860px){.g2{grid-template-columns:1fr}}
.fl{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 2px}
.fv{font-size:16px;line-height:1.5}
.pt{font-size:11px;font-weight:700;background:#EFEBE2;color:var(--muted);border-radius:99px;padding:1px 8px;margin-left:6px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:20px}
.fact{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--warm)}.fact span{display:block;font-size:12px;font-weight:700;color:var(--muted)}.fact b{font-size:15px}
.tl{list-style:none;margin:0;padding:0}.tl li{padding:8px 0 8px 16px;border-left:3px solid var(--line);margin-left:4px;font-size:14px}.tl li small{display:block;color:var(--muted);font-size:12px}
.demo{background:#F1F2F8}
@media(max-width:640px){#app{padding:18px!important;border-radius:18px}}
.empty{border:1px dashed var(--line2);border-radius:6px;padding:28px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="demo">Demo prototype. Sample data. The AI suggestions are simulated, not a live AI. Nothing is saved.</div>
<div class="hero">
 <div class="wrap"><div class="bar">
  <div class="row" style="gap:20px"><div class="brand">Goals <span>2027</span></div><div id="crumb" style="font-size:15px"></div></div>
  <label class="who">Viewing as <select id="role" aria-label="Viewing as"><option value="dir">Director, Digital (you)</option><option value="mgr">Manager, Web desk</option><option value="mgr2">Manager, Mobile</option><option value="mgr3">Manager, Audience</option><option value="emp">Employee, Sara Khan (Web desk)</option><option value="ed">Omar Saleh, ED Digital (approver)</option></select></label>
 </div></div>
 <div class="wrap"><nav aria-label="Sections" style="display:flex;gap:4px"><button class="tab" id="tabList">My goals</button><button class="tab" id="tabAlign">Alignment</button><button class="tab" id="tabDash">Dashboard</button></nav></div>
 <div class="wrap" id="hero"></div>
</div>
<main class="wrap" id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let goals=[
 {id:1,title:'Cut publishing delay on breaking stories',parent:'Faster digital delivery',status:'ok',statusText:'Approved',own:40,contribs:[{who:'Director, Video',goal:'Faster video publishing tools',p:45,status:'Linked'}],measure:'Median time from filing to publish under 6 minutes by Q2',due:'30 June 2027',pushed:[{who:'Manager, Web desk',p:25,d:'8 Nov 2026',n:'Template draft is ready.',due:'30 June 2027'},{who:'Manager, Mobile',p:10,d:'9 Nov 2026',n:'Kick-off held with the app team.',due:'30 June 2027'}],also:[]},
 {id:2,title:'Launch the new video player on all apps',parent:'Faster digital delivery',status:'att',statusText:'Awaiting approval',own:15,contribs:[],measure:'Player live on web, iOS and Android',due:'30 September 2027',pushed:[],also:[]},
 {id:3,title:'Grow weekly digital audience by 12%',parent:'Reach more Arabic-speaking audiences',status:'ok',statusText:'Approved',own:55,contribs:[],measure:'Weekly unique users up 12% on 2026',due:'31 December 2027',pushed:[],also:[]}
];
let cErr='',view='list',wiz=null,step=1,idc=10,gid=null,gEdit=false,cAddOpen=false;
let empGoals=[];const EMP_MGR='Manager, Web desk';const MGRS={mgr:'Manager, Web desk',mgr2:'Manager, Mobile',mgr3:'Manager, Audience'};
const CONTRIB_OPTS=['Director, Video','Director, Web','Director, Social','Rana Haddad, ED News','Khalid Nasser, ED Arabic'];
const teamAvg=g=>g.pushed&&g.pushed.length?Math.round(g.pushed.reduce((t,x)=>t+x.p,0)/g.pushed.length):null;
const bar1=(label,p,cls,sub)=>`<div style="margin-top:10px"><div class="row" style="justify-content:space-between;font-size:14px;${cls?'':''}"><span>${label}</span><span>${p}%</span></div><div class="bar-track" role="img" aria-label="${esc(label)} ${p} percent"><div class="bar-fill ${cls||''}" style="width:${p}%"></div></div>${sub?`<div style="font-size:12px;color:var(--muted);margin-top:2px">${sub}</div>`:''}</div>`;
function rollup(g,detail){let h='';(g.contribs||[]).filter(c=>c.status==='Linked').forEach(c=>{h+=bar1('Contributor: '+esc(c.who),c.p,'c',detail?'Their goal: '+esc(c.goal):'')});
 const n=g.pushed?g.pushed.length:0;if(n){if(detail){g.pushed.forEach(x=>{h+=bar1('Team: '+esc(x.who),x.p,'t',esc(x.n||'')+' &middot; '+esc(x.d))});h+=`<div style="font-size:12px;color:var(--muted);margin-top:8px">Team average ${teamAvg(g)}%. How the owner, contributor and team figures combine into one overall number is not decided yet (D-44).</div>`}else h+=bar1('Team ('+n+' manager'+(n>1?'s':'')+', average)',teamAvg(g),'t','')}
 return h}
function contribCard(g){const cs=g.contribs||[],avail=CONTRIB_OPTS.filter(o=>!cs.some(c=>c.who===o));
 return `<div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between"><h3 style="font-size:17px">Contributors</h3>${avail.length?'<button class="btn small" id="cAdd">'+(cAddOpen?'Close':'Add contributor')+'</button>':''}</div>
 ${cAddOpen?`<div style="margin-top:10px"><label class="fl" for="cSel" style="margin-top:0">Who?</label><select id="cSel" style="width:100%">${avail.map(o=>`<option>${esc(o)}</option>`).join('')}</select><label class="fl" for="cRole">Their role on this goal</label><select id="cRole" style="width:100%"><option>Contributor</option><option>Owner</option></select>${cErr?`<div role="alert" style="margin-top:10px;padding:10px 14px;border-radius:12px;background:#FDECEC;border:1px solid #C0392B;color:#8A1F14;font-size:14px"><strong>Not allowed.</strong> ${esc(cErr)}</div>`:''}<div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn small primary" id="cOk">Invite</button></div></div>`:''}
 ${cs.length?cs.map((c,i)=>`<div style="padding:10px 0;border-top:1px solid var(--line);margin-top:10px;font-size:14px"><div class="row" style="justify-content:space-between"><b>${esc(c.who)}</b><button class="link" data-cdel="${i}" aria-label="Remove ${esc(c.who)}">Remove</button></div>${c.status==='Linked'?`<div style="color:var(--muted)">Linked their goal: ${esc(c.goal)}</div><div class="bar-track" style="margin-top:6px"><div class="bar-fill c" style="width:${c.p}%"></div></div><div style="font-size:12px;color:var(--muted)">${c.p}% done</div>`:`<div style="color:var(--muted)">Invited. Waiting for them to link one of their own goals.</div><button class="link" data-csim="${i}" style="margin-top:4px">Demo only: pretend they linked a goal</button>`}</div>`).join(''):'<div style="font-size:14px;color:var(--muted);margin-top:8px">No contributors yet.</div>'}
 <p style="font-size:12px;color:var(--muted);margin:12px 0 0">A goal has exactly one owner: you. Contributors are other EDs or Directors who link their own goals to this one; a goal can have many. Whether a link needs approval is not decided yet (D-44).</p></div>`}
const TODAY=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const SEED={1:{desc:'Breaking stories wait too long between filing and publishing. This goal cuts that wait so our audience sees our reporting first.',start:'1 Jan 2027',target:'Under 6 minutes (median)',updates:[{d:'12 Nov 2026',n:'Fast-track template is live on the web desk.',p:40},{d:'29 Oct 2026',n:'Baseline measured at 11 minutes.',p:15}],approvals:[{who:'Omar Saleh, ED Digital',d:'5 Nov 2026',dec:'Approved',why:''}],audit:[{d:'12 Nov 2026',t:'Progress update: 40% · You, Director, Digital'},{d:'5 Nov 2026',t:'Approved · Omar Saleh, ED Digital'},{d:'3 Nov 2026',t:'Submitted for approval · You, Director, Digital'},{d:'1 Nov 2026',t:'Created · You, Director, Digital'}]},
2:{desc:'One video player across web, iOS and Android, so viewers get the same experience everywhere.',start:'1 Feb 2027',target:'Live on all 3 platforms',updates:[{d:'10 Nov 2026',n:'Web version is in testing.',p:15}],approvals:[],audit:[{d:'8 Nov 2026',t:'Submitted for approval · You, Director, Digital'},{d:'6 Nov 2026',t:'Created · You, Director, Digital'}]},
3:{desc:'Grow the number of people who use our digital products every week.',start:'1 Jan 2027',target:'+12% on the 2026 weekly average',updates:[{d:'9 Nov 2026',n:'Arabic app push notifications lifted weekly users.',p:55}],approvals:[{who:'Omar Saleh, ED Digital',d:'5 Nov 2026',dec:'Approved',why:''}],audit:[{d:'9 Nov 2026',t:'Progress update: 55% · You, Director, Digital'},{d:'5 Nov 2026',t:'Approved · Omar Saleh, ED Digital'},{d:'2 Nov 2026',t:'Created · You, Director, Digital'}]}};
