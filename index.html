<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AJMN Talent Suite Sandbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky suite header + amber sandbox bar, 1360px content column, three-zone cockpits, editorial light theme on white (single theme by design reference) */
:root{
  --bg:#FFFFFF; --ink:#14181F; --muted:#5A6472; --line:#DDE2E8; --soft:#F4F6F8;
  --navy:#123D70; --navy-d:#0B2748; --teal:#0E7C78; --teal-soft:#E8F3F2;
  --amber:#F0A93B; --amber-soft:#FFF6E5; --amber-ink:#17120A; --red:#C2362B; --red-soft:#FBEDEB; --bar:#9AA4B2;
  --display:'Space Grotesk','IBM Plex Sans Arabic','Segoe UI',sans-serif;
  --body:'Inter','IBM Plex Sans Arabic','Segoe UI',sans-serif;
  color-scheme:light;
}
:root[dir="rtl"]{ --display:'IBM Plex Sans Arabic','Segoe UI',sans-serif; --body:'IBM Plex Sans Arabic','Segoe UI',sans-serif; }
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}
[hidden]{display:none!important}
.lt,.ls,.n,.meta,.dt,.ds,.st,.gt,.aitext,.barrow>div:first-child,.chipbtn,.inp,h2{unicode-bidi:plaintext}
main:focus{outline:none}
a{color:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:900px){.gut{padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.hdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 28px;padding-block:6px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.02em;display:flex;align-items:baseline;gap:10px}
.brand small{font-family:var(--body);font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
nav.main{display:flex;flex-wrap:wrap;gap:0 22px;min-width:0}
nav.main a{font-size:14px;font-weight:500;text-decoration:none;padding:12px 2px;min-height:44px;display:flex;align-items:center;color:var(--muted);border-bottom:2px solid transparent}
nav.main a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--navy)}
nav.main a:hover{color:var(--ink)}
.lang{display:flex;gap:8px}
.lang button{min-height:40px;padding:0 14px;background:transparent;border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.sbar{background:var(--amber-soft);border-bottom:1px solid #F3D9A6}
.sbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:8px;font-size:13px}
.sbar label{font-weight:600}
.sbar select{min-height:36px;padding:0 10px;border:1px solid #E6C68A;border-radius:6px;background:var(--bg)}
.sbar .who{color:var(--muted)}
.sbar .sp{flex:1 1 auto}
.tag-sandbox{font-family:var(--display);font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--amber-ink);background:var(--amber);border-radius:4px;padding:3px 8px}

/* page */
main{max-width:1360px;margin:0 auto;padding-block:32px 96px;display:flex;flex-direction:column;gap:24px}
.phead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.phead>div:first-child{display:flex;flex-direction:column;gap:8px;min-width:0}
.eyebrow{font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--navy)}
.eyebrow.teal{color:var(--teal)}
h1{margin:0;font-family:var(--display);font-size:clamp(28px,4vw,38px);font-weight:700;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-family:var(--display);font-size:20px;font-weight:700;text-wrap:balance}
h3{margin:0;font-family:var(--display);font-size:16px;font-weight:600}
.sample{font-size:12.5px;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.grid{display:flex;flex-wrap:wrap;gap:20px;align-items:stretch}
.card{flex:1 1 320px;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:16px}
.card.wide{flex-basis:420px}
.card.full{flex-basis:100%}
.card.ai{border-color:var(--teal)}
.card.warn{border-color:var(--amber);background:var(--amber-soft)}
.chead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.meta{font-size:12.5px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line);text-align:start;background:none;border-inline:0;border-bottom:0;width:100%}
button.li{cursor:pointer}
button.li:hover .lt{color:var(--navy)}
.li .lt{font-size:15px;font-weight:500;line-height:1.3}
.li .ls{font-size:13px;color:var(--muted);line-height:1.35}
.li>div:first-child{min-width:0}
.st{font-size:13px;font-weight:600;white-space:nowrap}
.c-navy{color:var(--navy)}.c-teal{color:var(--teal)}.c-red{color:var(--red)}.c-muted{color:var(--muted)}
.empty{font-size:13.5px;color:var(--muted);padding:12px 0;border-top:1px solid var(--line)}

/* controls */
.btn{min-height:40px;padding:0 16px;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:#FFFFFF;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--navy-d)}
.btn.ghost{background:var(--bg);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.teal{background:var(--teal);border-color:var(--teal)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 180px}
.field label{font-size:12.5px;color:var(--muted)}
.field input,.field select,.field textarea,.inp{min-height:40px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:100%}
.field textarea{min-height:72px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipbtn{min-height:40px;padding:0 14px;background:var(--soft);border:1px solid var(--line);border-radius:999px;font-size:13.5px;cursor:pointer;text-align:start}
.chipbtn:hover{border-color:var(--teal)}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--bg);white-space:nowrap}
.pill.ok{color:var(--teal);border-color:#A9D3CF;background:var(--teal-soft)}
.pill.wait{color:#8A5A08;border-color:#F0CF94;background:var(--amber-soft)}
.pill.bad{color:var(--red);border-color:#EDB8B2;background:var(--red-soft)}
.pill.navy{color:var(--navy);border-color:#B7C6DA;background:#EEF2F8}
.pill.conf{color:var(--ink);border-style:dashed}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{min-height:44px;padding:0 14px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font-weight:500;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--teal)}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:8px;padding:10px 14px}
.deny{border:1px solid #EDB8B2;background:var(--red-soft);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:8px}
.deny h2{color:var(--red)}

/* bars */
.bars{display:flex;flex-direction:column;gap:14px}
.barrow{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr) 84px;gap:12px;align-items:center}
.barrow .n{font-size:13px;color:var(--muted);text-align:end;font-variant-numeric:tabular-nums}
.track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.track>div{height:100%;border-radius:5px}
.dual{display:flex;flex-direction:column;gap:4px}
.dual>div{height:8px;border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.stack{display:flex;height:22px;border-radius:5px;overflow:hidden;gap:2px}
.stack>div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;min-width:18px}

/* ai */
.aibox{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.ailbl{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}
.aitext{font-size:14.5px;line-height:1.5}

/* tables */
.scroll{overflow-x:auto;min-width:0}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:start;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:start}
.tbl td.num{font-variant-numeric:tabular-nums}
.tbl .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}

/* goals */
.goal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 0;border-top:1px solid var(--line)}
.goal .gt{font-size:15px;font-weight:500}
.goal .gs{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.goal .gr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.goal .track{grid-column:1/-1;height:6px}

/* review stepper */
.steps{display:flex;flex-wrap:wrap;gap:8px}
.step{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--muted)}
.step b{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);font-size:12px;color:var(--ink)}
.step.done{color:var(--teal);border-color:#A9D3CF}.step.done b{background:var(--teal);color:#FFFFFF}
.step.now{color:var(--ink);border-color:var(--amber);background:var(--amber-soft)}.step.now b{background:var(--amber);color:var(--amber-ink)}
.rsec{display:flex;flex-direction:column;gap:10px}
.rline{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,220px) minmax(0,220px);gap:10px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rline .rh{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
@media(max-width:700px){.rline{grid-template-columns:1fr}}

/* nine box */
.nb{display:grid;grid-template-columns:28px repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(118px,auto)) 28px;gap:6px}
.nb .ax{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;justify-content:center}
.nb .ay{writing-mode:vertical-rl;transform:rotate(180deg)}
.cell{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;background:var(--bg);min-width:0;cursor:pointer;text-align:start}
.cell.hot{background:var(--teal-soft);border-color:#A9D3CF}
.cell.cool{background:var(--soft)}
.cell.drop{outline:2px dashed var(--teal);outline-offset:-4px}
.cell .cl{font-size:11.5px;font-weight:600;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.pchip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:12.5px;font-weight:500;cursor:grab;max-width:100%}
.pchip[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 2px #C9D6EA}
.pchip .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);flex:none}
.pchip.moved .dot{background:var(--teal)}
.tray{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:1px dashed var(--line);border-radius:8px;min-height:52px;align-items:center}

/* talent card */
.tcard{display:flex;flex-direction:column;gap:14px}
.tcard .av{width:52px;height:52px;border-radius:50%;background:var(--navy);color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px;flex:none}
.kv{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr);gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}

/* toggles */
.sw{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px}
.sw input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none}
.sw input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;background:#FFFFFF;transition:inset-inline-start .15s}
.sw input:checked{background:var(--teal)}
.sw input:checked::after{inset-inline-start:19px}

/* demo drawer */
.dfab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));inset-inline-end:max(20px,env(safe-area-inset-right,0px));z-index:40;box-shadow:0 6px 20px rgba(20,24,31,.18)}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(420px,100%);background:var(--bg);border-inline-start:1px solid var(--line);z-index:50;display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(20,24,31,.12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer .dh{padding:20px 22px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.drawer .db{overflow:auto;padding:8px 22px 22px;display:flex;flex-direction:column}
.dstep{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.dstep .ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
.dstep.ok .ck{background:var(--teal);border-color:var(--teal);color:#FFFFFF}
.dstep .dt{font-size:14px;font-weight:500}
.dstep .ds{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;bottom:calc(76px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#FFFFFF;padding:10px 16px;border-radius:8px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px)}
.panel{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px}
@media(max-width:640px){.barrow{grid-template-columns:minmax(0,110px) minmax(0,1fr) 60px}.kv{grid-template-columns:1fr}}
@media(min-width:1100px){body.wd .top,body.wd main{margin-inline-end:420px}body.wd main{margin-inline-start:0}body.wd .dfab{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 const people=[

function barRow(label,pct,n,col){return `<div class="barrow"><div style="font-size:14px">${esc(label)}</div><div class="track"><div style="width:${Math.max(2,pct)}%;background:${col}"></div></div><div class="n">${esc(n)}</div></div>`;}
function teamSkills(){const sk=['Editorial judgement','Live production','Audience analytics','Data storytelling'];return `<section class="card wide"><div class="chead"><h2>Team skills</h2><span class="meta">From the skill library</span></div><div class="bars">${sk.map(s=>{const n=TEAM.filter(id=>per(id).skills.includes(s)).length;const p=Math.round(n/9*100);return barRow(s,p,n+' of 9',p<20?'var(--red)':p<60?'var(--teal)':'var(--amber)')}).join('')}</div></section>`;}
function cycleHealth(){const open=TEAM.filter(id=>S.reviews[id].step==='done').length;return `<section class="card wide"><div class="chead"><h2>Cycle health</h2><span class="meta">All modules</span></div><div class="bars">${barRow('Goals approved',91,'91%','var(--amber)')}${barRow('Reviews released',Math.round(open/9*100),open+' of 9','var(--amber)')}${barRow('Calibration sessions',38,'3 of 8','var(--teal)')}${barRow('Development plans',54,'54%','var(--teal)')}</div></section>`;}
function bench(){return `<section class="card wide"><div class="chead"><h2>Bench strength</h2><span class="meta">Key positions by division</span></div><div class="legend"><span><i style="background:var(--red)"></i>No successor</span><span><i style="background:var(--amber)"></i>One successor</span><span><i style="background:var(--teal)"></i>Two or more</span></div><div class="bars">${[['News',2,5,6],['Programmes',1,4,5],['Technology',3,4,3],['Digital',2,3,2],['Corporate',1,3,6]].map(([d,a,b,c])=>`<div class="barrow" style="grid-template-columns:minmax(0,120px) minmax(0,1fr)"><div style="font-size:14px">${d}</div><div class="stack"><div style="flex:${a};background:var(--red);color:#FFFFFF">${a}</div><div style="flex:${b};background:var(--amber);color:var(--amber-ink)">${b}</div><div style="flex:${c};background:var(--teal);color:#FFFFFF">${c}</div></div></div>`).join('')}</div></section>`;}
function gridSummary(){const L=S.cfg.grid.pub.labels;const cnt={};Object.values(S.calib.place).forEach(p=>{const k=p.pot+'-'+p.perf;cnt[k]=(cnt[k]||0)+1});return `<section class="card wide"><div class="chead"><h2>Newsroom production grid</h2><span class="meta">${Object.keys(S.calib.place).length} placed · ${S.calib.unrated.length} waiting</span></div><div class="list">${Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([k,n])=>li(L[k],'Potential '+BAND[k[0]]+' · performance '+BAND[k[2]],n+' people','teal','talent')).join('')}</div></section>`;}

 return head(t('audit'),'Who, what, before, after, when')+`<section class="card full"><div class="chead"><h2>${S.audit.length} events</h2><span class="meta">Append-only · newest first</span></div><div class="scroll"><table class="tbl"><thead><tr><th>When</th><th>Who</th><th>Role</th><th>Action</th><th>Object</th><th>Before</th><th>After</th></tr></thead><tbody>${S.audit.slice().reverse().map(a=>`<tr><td class="num" style="white-space:nowrap">${esc(a.ts)}</td><td>${esc(per(a.actor).name)}</td><td>${esc(t('r_'+a.role))}</td><td class="mono">${esc(a.action)}</td><td>${esc(a.obj)}</td><td>${esc(a.before)}</td><td>${esc(a.after)}</td></tr>`).join('')}</tbody></table></div></section>`;
}

/* ============ demo script ============ */
const DEMO=[
 {k:'goal',t:'An employee creates a goal',s:'As Sara, add a goal on the Goals page.',role:'employee',r:'goals'},
 {k:'rate',t:'The manager reviews and rates',s:'As Omar, open Sara’s review, rate, submit, then sign off.',role:'manager',r:'performance',open:'sara'},
 {k:'calib',t:'A facilitator calibrates',s:'As Yusuf, move Sara on the grid with a reason.',role:'talent',r:'talent',sub:['talent','calibration']},
 {k:'card',t:'The result appears on the talent card',s:'Open Sara’s talent card under Succession.',role:'talent',r:'talent',sub:['talent','succession'],card:'sara'},
 {k:'nom',t:'A successor is nominated',s:'Nominate someone for Senior Editor, Elections Desk.',role:'manager',r:'talent',sub:['talent','succession']},
 {k:'dev',t:'A development item is created from the review',s:'On Sara’s released review, create a development item.',role:'manager',r:'performance',open:'sara'},
 {k:'scale',t:'Admin changes a rating scale label',s:'Edit a label on the 4-point scale and publish.',role:'admin',r:'admin',sub:['admin','scales']},
 {k:'route',t:'Admin changes a route step',s:'Rename a step or switch on HR review, then publish.',role:'admin',r:'admin',sub:['admin','route']},
 {k:'deny',t:'An employee cannot read another review',s:'As Sara, try to open Karim’s review. It is refused and logged.',role:'employee',r:'performance',open:'karim'},
 {k:'audit',t:'Every action is in the audit log',s:'Open the audit log as admin.',role:'admin',r:'audit'}
];
function drawer(){
 const n=DEMO.filter(d=>S.done[d.k]).length;
 return `<div class="dh"><div class="row" style="justify-content:space-between"><div class="eyebrow">Gate A walkthrough</div><button class="btn ghost sm" data-act="drawer">Close</button></div><h2>Demo script</h2><div class="meta">${n} of ${DEMO.length} done. Each step switches role and opens the right screen.</div><div class="track"><div style="width:${n/DEMO.length*100}%;background:var(--teal)"></div></div></div>
 <div class="db">${DEMO.map((d,i)=>`<div class="dstep ${S.done[d.k]?'ok':''}"><div class="ck">${S.done[d.k]?'✓':i+1}</div><div><div class="dt">${esc(d.t)}</div><div class="ds">${esc(d.s)}</div></div><button class="btn ghost sm" data-act="demogo" data-i="${i}">Go</button></div>`).join('')}</div>`;
}

/* ============ render ============ */
const VIEWS={home,goals,performance,growth,opportunities,talent,insights,admin,audit};
function render(focus){
 document.documentElement.lang=S.lang;document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
 if(!NAV[S.role].includes(S.route)&&S.route!=='performance')S.route=S.route; // direct URL still allowed; views enforce permission
 renderShell();
 const v=VIEWS[S.route]||home;
 document.getElementById('app').innerHTML=v();
 const dr=document.getElementById('drawer');dr.hidden=!S.drawer;document.body.classList.toggle('wd',!!S.drawer);if(S.drawer)dr.innerHTML=drawer();
 save();
 if(focus)document.getElementById('app').focus({preventScroll:true});
}
function go(r){S.route=r;S.ans=null;if(location.hash!=='#'+r)history.replaceState(null,'','#'+r);render(true);window.scrollTo(0,0);}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(VIEWS[h]&&h!==S.route){S.route=h;S.ans=null;S.openReview=null;render(true);}});

function setRole(r){S.role=r;S.openReview=null;S.ans=null;S.sel=null;S.pending=null;if(!NAV[r].includes(S.route))S.route='home';log('session.view_as','Sandbox role switch','',t('r_'+r));}

/* ============ actions ============ */
const ACT={
 go:el=>{S.openReview=null;go(el.dataset.r)},
 lang:el=>{S.lang=el.dataset.l;render()},
 reset:()=>{const keepLang=S.lang;S=seed();S.lang=keepLang;history.replaceState(null,'','#home');render();toast('Sandbox reset to seed data')},
 drawer:()=>{S.drawer=!S.drawer;render()},
 sub:el=>{S.sub[el.dataset.area]=el.dataset.k;S.openReview=null;render()},
 demogo:el=>{const d=DEMO[+el.dataset.i];setRole(d.role);if(d.sub)S.sub[d.sub[0]]=d.sub[1];if(d.r==='performance')S.sub.performance='reviews';S.openReview=d.open||null;if(d.card){S.card=d.card;}S.route=d.r;history.replaceState(null,'','#'+d.r);
  if(d.k==='deny'&&!inScope('karim')){log('access.denied','Review · Karim Nasser','GET /api/v1/reviews/karim','403 refused');S.done.deny=true;}
  if(d.k==='card'&&S.calib.trail.some(x=>x.pid==='sara'))S.done.card=true;
  if(d.k==='audit')S.done.audit=true;
  if(window.innerWidth<1100)S.drawer=false;render(true);window.scrollTo(0,0)},
 askq:el=>doAsk(el.dataset.q),
 aidiscard:()=>{S.ans=null;render()},
 prog:el=>{const g=S.goals.find(x=>x.id===el.dataset.id);const b=g.progress;g.progress=Math.min(100,g.progress+10);g.updated=TODAY.toISOString().slice(0,10);log('goal.progress','Goal · '+g.title,b+'%',g.progress+'%');render()},
 approve:el=>{const g=S.goals.find(x=>x.id===el.dataset.id);g.status='Approved';log('goal.approve','Goal · '+g.title,'Submitted','Approved');toast('Goal approved');render()},
 approveall:()=>{S.goals.filter(g=>isTeam(g.owner)&&g.status==='Submitted').forEach(g=>{g.status='Approved';log('goal.approve','Goal · '+g.title,'Submitted','Approved')});toast('All submitted goals approved');render()},
 openrev:el=>{S.openReview=el.dataset.id;render(true)},
 closerev:()=>{S.openReview=null;render()},
 devfromrev:el=>{const id=el.dataset.id;const item={id:'d'+Date.now(),pid:id,title:'Build data storytelling for the elections desk',cat:'Skills & Future Readiness',link:'Data storytelling',status:'Not started',source:'2026 review'};S.dev.push(item);log('dev.create','Development item · '+per(id).name,'',item.title+' (from review)');S.done.dev=true;S.sub.growth='development';toast('Development item created from the review');go('growth')},
 reopen:el=>{const id=el.dataset.id;const rv=S.reviews[id];rv.step='manager';rv.released=false;log('review.reopen','Review · '+per(id).name,'Released','Manager assessment · reason: correction requested by manager');toast('Review reopened. Reason recorded.');render()},
 chip:(el,e)=>{e.stopPropagation();if(!['talent','manager','hrbp'].includes(S.role))return;S.sel=S.sel===el.dataset.id?null:el.dataset.id;render()},
 cell:el=>{if(!S.sel)return;startMove(S.sel,el.dataset.k)},
 cancelmove:()=>{S.pending=null;S.sel=null;render()},
 release:()=>{S.calib.released=true;log('calibration.release','Session · Newsroom production','Draft','Released to talent records');toast('Results released');render()},
 card:el=>{S.card=el.dataset.id;log('talentcard.view','Talent card · '+per(el.dataset.id).name,'','');if(el.dataset.id==='sara'&&S.calib.trail.some(x=>x.pid==='sara'))S.done.card=true;render()},
 interest:el=>{const o=S.opps.find(x=>x.id===el.dataset.id);o.interest.push({pid:ROLE_USER[S.role],status:'Awaiting manager'});log('opportunity.interest','Opportunity · '+o.title,'','Awaiting manager');toast('Interest sent. Your manager approves before you start.');render()},
 oppok:el=>oppSet(el,'Approved by manager'),oppno:el=>oppSet(el,'Declined'),
 complete:el=>{const a=S.assign.find(x=>x.id===el.dataset.id);const b=a.status;a.status='Completed';log('learning.complete','Learning · '+S.catalogue.find(c=>c.id===a.lid).title,b,'Completed');render()},
 enrol:el=>{S.assign.push({id:'a'+Date.now(),pid:ROLE_USER[S.role],lid:el.dataset.id,due:'2026-12-31',status:'Assigned'});log('learning.assign','Learning · '+S.catalogue.find(c=>c.id===el.dataset.id).title,'','Assigned');render()},
 discard:el=>{const [a,b]=el.dataset.k.split('.');S.cfg[a][b].draft=null;log('config.discard','Config · '+S.cfg[a][b].name,'Draft','Discarded');render()},
 copycfg:()=>{const ta=document.getElementById('cfgjson');const txt=ta.value;(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('Configuration copied')).catch(()=>{ta.select();toast('Select all and copy')});log('config.export','Configuration transport file','','Exported')}
};
function oppSet(el,status){const o=S.opps.find(x=>x.id===el.dataset.id);const i=o.interest.find(x=>x.pid===el.dataset.p);const b=i.status;i.status=status;log('opportunity.decision','Opportunity · '+o.title+' · '+per(i.pid).name,b,status);render()}
function startMove(pid,to){const cur=S.calib.place[pid];const from=cur?cur.pot+'-'+cur.perf:null;if(from===to){S.sel=null;render();return;}if(pid===ROLE_USER[S.role]){toast('Nobody can calibrate their own record');return;}S.pending={pid,from,to};S.sel=null;render();const r=document.getElementById('mr');if(r)r.focus();}
function doAsk(q){const a=answer(q);S.ans=Object.assign({q},a);log(a.denied?'ai.ask.refused':'ai.ask','Ask anything',q.slice(0,60),a.denied?'Refused: outside permissions':'Answered · categories: '+(a.src.split('.')[0]));render()}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;if(el.tagName==='A')e.preventDefault();const f=ACT[el.dataset.act];if(f)f(el,e);});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.cell')){e.preventDefault();ACT.cell(e.target);}if(e.key==='Escape'&&S.drawer){S.drawer=false;render();}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.chg==='role'){setRole(el.value);history.replaceState(null,'','#'+S.route);render(true);}
 if(el.dataset.chg==='ai'){const b=S.cfg.ai[el.dataset.f][el.dataset.r];S.cfg.ai[el.dataset.f][el.dataset.r]=el.checked;log('config.publish','AI switch · '+el.dataset.f+' · '+t('r_'+el.dataset.r),b?'On':'Off',el.checked?'On':'Off');render();}});
/* drag and drop on the grid */
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.pchip[draggable]');if(c){e.dataTransfer.setData('text/plain',c.dataset.id);e.dataTransfer.effectAllowed='move';}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.cell');if(c){e.preventDefault();c.classList.add('drop');}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('.cell');if(c)c.classList.remove('drop');});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.cell');if(c){e.preventDefault();c.classList.remove('drop');const id=e.dataTransfer.getData('text/plain');if(id)startMove(id,c.dataset.k);}});

/* forms */
document.addEventListener('submit',e=>{
 const f=e.target;e.preventDefault();const fd=new FormData(f);const kind=f.dataset.form;const by=e.submitter?e.submitter.value:fd.get('do');const u=ROLE_USER[S.role];
 if(kind==='ask'){const q=String(fd.get('q')||'').trim();if(q)doAsk(q);return;}
 if(kind==='goal'){const title=String(fd.get('title')).trim();if(!title)return;const mine=S.goals.filter(g=>g.owner===u);if(mine.length>=S.cfg.goalrules.max){toast(`Your plan already has ${S.cfg.goalrules.max} goals, the maximum set in configuration`);return;}
  const g={id:'g'+Date.now(),owner:u,title,cat:fd.get('cat'),weight:+fd.get('weight')||10,progress:0,status:'Submitted',updated:TODAY.toISOString().slice(0,10),align:fd.get('align'),contributors:[]};S.goals.push(g);log('goal.create','Goal · '+title,'','Submitted for approval');S.done.goal=true;toast('Goal added and sent to your manager');render();return;}
 if(kind==='review'){const id=f.dataset.id,rv=S.reviews[id];const before=stepLabel(rv.step);
  if(by==='self'){if(!fd.get('self')){toast('Choose an overall self rating first');return;}rv.self=+fd.get('self');rv.selfComment=fd.get('selfComment');S.comps.forEach((c,i)=>rv.comp['cs'+i]=+fd.get('cs'+i)||null);rv.step=nextStep('self');}
  if(by==='mgr'){if(!fd.get('mgr')){toast('Choose an overall rating first');return;}rv.mgr=+fd.get('mgr');rv.mgrComment=fd.get('mgrComment')||'';S.comps.forEach((c,i)=>rv.comp['cm'+i]=+fd.get('cm'+i)||null);rv.step=nextStep('manager');}
  if(by==='hr'){rv.step=nextStep('hr');}
  if(by==='sign'){rv.step='done';rv.released=true;const band=bandOf('four',rv.mgr);if(!S.calib.place[id]){S.calib.place[id]={perf:band,pot:2};}else S.calib.place[id].perf=band;S.calib.unrated=S.calib.unrated.filter(x=>x!==id);if(id==='sara')S.done.rate=true;}
  if(rv.step==='done'&&!rv.released){rv.released=true;const band=bandOf('four',rv.mgr);S.calib.place[id]=Object.assign({pot:2},S.calib.place[id]||{},{perf:band});S.calib.unrated=S.calib.unrated.filter(x=>x!==id);if(id==='sara')S.done.rate=true;}
  log(by==='sign'?'review.signoff':'review.submit','Review · '+per(id).name,before,stepLabel(rv.step)+(rv.mgr&&by!=='self'?' · '+labelOf('four',rv.mgr):''));toast(rv.step==='done'?'Review signed off and released':'Moved to '+stepLabel(rv.step));render();return;}
 if(kind==='fb'){const to=fd.get('to'),k=fd.get('kind'),txt=String(fd.get('text')||'').trim();if(k==='given'&&!txt){toast('Write the feedback first');return;}S.feedback.push({id:'f'+Date.now(),from:u,to,text:k==='given'?txt:'',goal:null,date:TODAY.toISOString().slice(0,10),kind:k});log(k==='given'?'feedback.give':'feedback.request','Feedback · '+per(to).name,'',k==='given'?'Given':'Requested');render();return;}
 if(kind==='move'){const reason=String(fd.get('reason')||'').trim();if(!reason){toast('A reason is required');return;}const pm=S.pending;const [pot,perf]=pm.to.split('-').map(Number);S.calib.place[pm.pid]={pot,perf};S.calib.unrated=S.calib.unrated.filter(x=>x!==pm.pid);S.calib.trail.push({pid:pm.pid,from:pm.from,to:pm.to,reason,by:u});const L=S.cfg.grid.pub.labels;log('calibration.move','Talent record · '+per(pm.pid).name,L[pm.from]||'Not placed',L[pm.to]+' · reason: '+reason);if(pm.pid==='sara')S.done.calib=true;S.pending=null;toast('Moved and written to the talent record');render();return;}
 if(kind==='nom'){const pos=S.positions.find(p=>p.id===f.dataset.id);const pid=fd.get('pid');if(!pid)return;pos.succ.push({pid,ready:fd.get('ready')});log('succession.nominate','Position · '+pos.title,'',per(pid).name+' · '+fd.get('ready'));S.done.nom=true;toast('Successor nominated');render();return;}
 if(kind==='dev'){const pid=fd.get('pid')||u;S.dev.push({id:'d'+Date.now(),pid,title:fd.get('title'),cat:fd.get('cat'),link:fd.get('link'),status:'Not started',source:S.role==='manager'?'Manager':'Self'});log('dev.create','Development item · '+per(pid).name,'',fd.get('title'));render();return;}
 if(kind==='opp'){const o={id:'o'+Date.now(),title:fd.get('title'),type:fd.get('type'),dur:fd.get('dur'),owner:u,skills:[fd.get('skill'),'Editorial judgement'].filter((v,i,a)=>a.indexOf(v)===i),interest:[]};S.opps.unshift(o);log('opportunity.post','Opportunity · '+o.title,'','Open');toast('Opportunity posted');render();return;}
 if(kind==='scale'){const k=f.dataset.k,s=S.cfg.scales[k];const vals=(s.draft||s.pub).values.map((v,i)=>({v:v.v,label:String(fd.get('l'+i)).trim()||v.label,band:+fd.get('b'+i)}));
  if(by==='publish'){const before=s.pub.values.map(v=>v.label).join(' / ');s.pub={version:s.pub.version+1,values:vals};s.draft=null;log('config.publish','Config · '+s.name+' v'+s.pub.version,before,vals.map(v=>v.label).join(' / '));S.done.scale=true;toast('Published. Review forms now use the new labels.');}
  else{s.draft={values:vals};log('config.draft','Config · '+s.name,'','Draft saved');toast('Draft saved. Not live until you publish.');}render();return;}
 if(kind==='route'){const s=S.cfg.route;const st=(s.draft||s.pub).steps.map((x,i)=>({...x,label:String(fd.get('l'+i)).trim()||x.label,on:x.key==='self'||x.key==='signoff'?true:fd.get('on'+i)==='on'}));
  if(by==='publish'){const before=steps().map(x=>x.label).join(' → ');s.pub={version:s.pub.version+1,steps:st};s.draft=null;Object.values(S.reviews).forEach(rv=>{if(rv.step!=='done'&&!steps().some(x=>x.key===rv.step))rv.step=nextStep('manager');});log('config.publish','Config · Review route v'+s.pub.version,before,steps().map(x=>x.label).join(' → '));S.done.route=true;toast('Route published');}
  else{s.draft={steps:st};log('config.draft','Config · Review route','','Draft saved');toast('Draft saved. Not live until you publish.');}render();return;}
 if(kind==='grid'){const s=S.cfg.grid;const labels={};Object.keys(s.pub.labels).forEach(k=>labels[k]=String(fd.get(k)).trim()||s.pub.labels[k]);
  if(by==='publish'){s.pub={version:s.pub.version+1,labels};s.draft=null;log('config.publish','Config · Calibration grid v'+s.pub.version,'',Object.values(labels).slice(0,3).join(' / ')+' …');toast('Grid labels published');}else{s.draft={labels};log('config.draft','Config · Calibration grid','','Draft saved');toast('Draft saved');}render();return;}
});

/* boot */
(function(){const h=location.hash.slice(1);if(VIEWS[h])S.route=h;render();})();
</script>
