# THE ONLY FILE EDITED FOR DEPLOY CONFIG.
# Checked by `canvas validate` (and again by `canvas deploy`) before anything is uploaded.
apiVersion: score.dev/v1b1

metadata:
  name: talent-suite                      # also the hostname: talent-suite--<team>.<base>
  # What people call it and what it does, shown in the console — `describe-app` writes them.
  annotations:
    canvas.dev/visibility: team                  # listed for the team — `canvas share private` keeps it to you
    canvas.dev/title: AJMN Talent Suite
    canvas.dev/description: A clickable sandbox prototype of the Talent Suite and its Strategy Room, beside a replica of the current SuccessFactors setup, for showing management how goals, reviews and strategy decisions would work. Synthetic data only.
    canvas.dev/category: experiment
    canvas.dev/tags: workflow, dashboard, multilingual
  #   canvas.dev/category: editorial                     # one, from the list in .canvas/contracts/
  #   canvas.dev/tags: news, workflow                    # up to three, from the same list
  #   canvas.dev/icon: src/static/icon.png               # square, ≤100 KB — asked for before deploy
  #   canvas.dev/cover: src/static/cover.jpg             # 1600×600, ≤300 KB — none: one is drawn for it

containers:
  app:                                # exactly one container, named `app`
    image: .                          # built by the platform; never a registry reference
    variables:
      PORT: ${resources.www.PORT}
      DATA_DIR: /data                 # attachments: db.mjs/api.mjs keep files in /data/files
    volumes:
      /data:
        source: ${resources.data}

resources:
  www:
    type: route
    params:
      port: 8080
      path: /healthz                  # answered by server.mjs — a mismatch is `probe.path`
      auth: sso                       # a company sign-in before anyone reaches the app; none: open to the company network
      access:
        read: ["canvas-erp-owners", "canvas-erp-members"]
      # access:                       # with auth: sso — who, once signed in. None: anyone
      #   read: ["Innovation and R&D"]        # may open it: emails, Entra groups, or canvas-<team>-members / -owners
      #   write: ["someone@aljazeera.net"]    # may also change things; absent: the same as read
      #   deny: []                            # never, whatever read and write say

  # the goals database: DATABASE_URL. The schema is db/migrations/*.sql (written by hand: this app is Node, not the platform's Python stack),
  # applied by the platform before each new version starts. server.mjs reads it through db.mjs and serves /api/* from api.mjs.
  db:
    type: postgres
    params: {size: 1Gi}
  data:                           # a disk of its own, kept across restarts: the files attached to activities
    type: volume                  # mounted at /data (above); deleted with the app, no backup
    params: {size: 1Gi}
  # the app's own AI key: OPENAI_BASE_URL, OPENAI_API_KEY and PLATFORM_LLM_MODELS, read by ai.mjs only. It writes goal ideas, measures, reviews
  # and return comments. qwen-flash is the company's own model: goal text does not leave the company. Every call is logged in ai_log.
  ai:
    type: llm
    params: {models: [qwen-flash]}
