 <div class="body" style="padding-left:16px"><div class="r1" style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><b style="font-size:16px">Forms (${rows.length})</b><span style="flex:1"></span><button class="btn" data-a="mkform">Create Form</button><button class="btn t" disabled>Send to Previous Step</button><button class="btn t" disabled>Final Submission</button><span>⚙</span></div>
 <div style="overflow-x:auto"><table class="t"><tr><th><input type="checkbox" aria-label="Select all"></th><th>Title</th><th>Employee</th><th>Current Step</th><th>Date Assigned</th><th>Step Due Date</th><th>Form Start Date</th></tr>
 ${rows.map(f=>`<tr class="cl" data-a="form" data-id="${f.id}"><td><input type="checkbox" aria-label="Select form" data-a="noop"></td><td>◔ &nbsp;${e(TPL[f.tpl].name)} for ${e(P[f.emp].name)}</td><td>${e(P[f.emp].name)} ▤</td><td>${f.status==='completed'?'Completed':TPL[f.tpl].steps[f.step]}</td><td style="text-align:right">${mdy(f.assigned)}</td><td style="text-align:right">–</td><td style="text-align:right">${mdy(f.start)}</td></tr>`).join('')||'<tr><td colspan="7" class="none">No Data</td></tr>'}</table></div></div></div></div>`);
}
function formPage(f){
 const ap=f.tpl==='appr',p=P[f.emp],gs=formGoals(f),tn=formTna(f),done=f.status==='completed',mine=f.status==='inbox';
 const secs=ap?[['si','👤 Employee Information'],['sg','🎯 Individual Goals'],['st','🎓 Training Needs'],['so','🏆 Overall Performance Summary'],['ss','Overall Score']]:[['si','👤 Employee Information'],['sg','Individual Goals']];
 const desc=t=>`<details class="desc"><summary>Description</summary><p>${t}</p></details>`;
 const row=(g,w)=>`<tr><td>${e(g.name)}</td>${w?`<td style="text-align:right;width:90px">${g.weight}%</td>`:''}<td style="width:150px;white-space:nowrap">${mine?`<button class="ib" data-a="edit" data-id="${g.id}" aria-label="Edit">✎</button><button class="ib" data-a="del" data-id="${g.id}" aria-label="Delete">🗑</button>`:''}<button class="ib" style="float:right" data-a="exp" data-id="${g.id}" aria-label="Details">${U.exp[g.id]?'⌄':'›'}</button></td></tr>${U.exp[g.id]?`<tr><td colspan="3" style="background:var(--bg)">${g.plan==='tna'?`Purpose: ${e(g.purpose)} · Target Date: ${fmt(g.due)}`:`Key Performance Indicator: ${e(g.metric)}<br>Weight: ${g.weight}% · Status: ${g.state} · % Complete: ${g.done}%`}</td></tr>`:''}`;
 return shell('perf',`<div class="sub"><button aria-current="page" data-a="go" data-h="perf">Reviews</button><button data-a="ptab" data-t="team">Team Overview</button><button data-a="ptab" data-t="exec">360 Executive Review</button></div>
 <div class="dh"><div class="crumb" style="padding-left:8px"><a href="#perf">My Forms</a> / Form Details</div><div class="tl" style="padding-left:8px"><h1>${e(TPL[f.tpl].name)} for ${e(p.name)}</h1><button class="btn t" data-a="hist" data-id="${f.id}">History</button><button class="btn t">Actions</button><button class="btn t" data-a="print">Print &amp; PDF</button></div>
 <div style="display:flex;gap:40px;align-items:center;padding:14px 8px 0"><span style="display:flex;gap:12px;align-items:center"><span class="pp" style="border:0;padding:0;min-height:0;width:auto;cursor:default"><span class="pa">${ini(p.name)}</span></span><b>${e(p.name)}</b> ▤</span>${ap?`<span>Overall Score:<br><b style="font-weight:400">${e(f.rating)||'–'}</b></span>`:''}<span>Current step: <b>${done?'Completed':TPL[f.tpl].steps[f.step]}</b></span></div></div>
 <div class="wrap" style="min-height:0"><nav class="fnav">${secs.map(s=>`<button data-a="jump" data-s="${s[0]}">${s[1]}</button>`).join('')}</nav><form class="main" data-f="pform" data-id="${f.id}" novalidate style="padding-bottom:90px"><div class="err fsec" id="ferr" hidden></div>
 <section class="fsec" id="si"><h2>👤 Employee Information</h2><div class="info">${[['First Name',p.first],['Last Name',p.last],['Employee ID',p.eid],['Division/Channel','N/A'],['Department','N/A'],['Job Title',p.title||'–'],['Manager',p.mgr?P[p.mgr].name:'–']].map(x=>`<div><small>${x[0]}:</small>${e(x[1])}</div>`).join('')}</div></section>
 <section class="fsec" id="sg"><h2>${ap?'🎯 ':''}Individual Goals<span class="sp"></span>${mine&&!done?`<button type="button" data-a="fnew" data-id="${f.id}" aria-label="Add goal">＋</button>`:''}</h2>${desc(ap?'🎯 Review outcomes and achievements. 📈 Consider impact. 📝 Record evidence and constructive feedback.':'This section includes Individual Goals only. Goals are populated from the Goal Type: <strong>Individual Goals</strong>.')}
 <div class="tw"><table class="t"><tr><th>Goal</th>${ap?'':'<th>Weight</th>'}<th>Action</th></tr>${gs.map(g=>row(g,!ap)).join('')||`<tr><td colspan="3" class="none">No Data</td></tr>`}</table></div></section>
 ${ap?`<section class="fsec" id="st"><h2>🎓 Training Needs<span class="sp"></span>${mine&&!done?`<button type="button" data-a="tna" data-id="${f.id}" aria-label="Add training need">＋</button>`:''}</h2>${desc('🎓 Identify the actual training course or programme. 🧩 Explain the capability gap and expected development outcome.')}
 <div class="tw"><table class="t"><tr><th>Goal</th><th>Action</th></tr>${tn.map(g=>row(g)).join('')||'<tr><td colspan="2" class="none">No Data</td></tr>'}</table></div></section>
 <section class="fsec" id="so"><h2>🏆 Overall Performance Summary</h2>${desc('🏆 Review the overall performance outcome and recognise contributions.')}
 <div class="tw"><table class="t"><tr><th>Name</th><th>Rating</th></tr><tr><td><b>Overall Form Rating:<span style="color:#BB0000">*</span></b> ⓘ</td><td><select class="fi" style="max-width:210px" name="rating" data-chg="frating" data-id="${f.id}" ${mine&&!done?'':'disabled'} aria-label="Overall Form Rating"><option value="">Select One</option>${opt(SCALE,f.rating)}</select></td></tr></table></div>
 <div class="desc" style="margin-top:10px;padding:10px 16px"><label for="fcm"><b>Section Comments:<span style="color:#BB0000">*</span></b><br>Manager's Comments</label><textarea class="fi" id="fcm" name="comments" maxlength="4000" style="max-width:none;margin-top:8px" ${mine&&!done?'':'disabled'}>${e(f.comments)}</textarea></div></section>
 <section class="fsec" id="ss"><div class="score">Overall Score: &nbsp;${e(f.rating)||'–'}</div></section>`:''}
 ${mine&&!done?`<div class="foot"><button class="btn em" name="do" value="next">Next Step</button><button class="btn" name="do" value="close">Save and Close</button><button class="btn" name="do" value="save">Save</button></div>`:''}</form></div>`);
}

/* ---------- calibration ---------- */
function calibPage(){
 const tot=S.cal.length,by=i=>S.cal.filter(c=>c.col===i),pc=n=>(n/tot*100).toFixed(1);
 const tabs=`<div class="tabsbar" style="background:none;border:0;padding:0 28px">${[['dash','Dashboard'],['list','List View'],['table','Table View']].map(([k,l])=>`<button aria-selected="${U.ctab===k}" data-a="ctab" data-t="${k}">${l}</button>`).join('')}</div>`;
 let body;
 if(U.ctab==='table')body=`<div class="warn">⚠ &nbsp;There are ${by(0).length} subjects with one or more of the following rating types: Unrated, Too New To Be Rated.</div><div class="cal">${CALCOLS.map((c,i)=>`<div class="col" data-col="${i}"><h3>${c}<small>${by(i).length} (${pc(by(i).length)}%)</small></h3><div class="nh">Name</div>${by(i).map(p=>`<div class="cp" draggable="${!S.calFinal}" data-pid="${p.id}"><div class="n"><i></i><span>${e(p.name)}</span>▤ ▭</div><div class="rk">Rank ≡ : <span>${p.rank||'- -'}</span></div></div>`).join('')}</div>`).join('')}</div>`;
 if(U.ctab==='list')body=`<div class="body"><div class="tw"><table class="t"><tr><th>Name</th><th>Overall Form Rating</th><th>Rank</th></tr>${S.cal.map(p=>`<tr><td>${e(p.name)}</td><td><select class="stsel" data-chg="calcol" data-pid="${p.id}" ${S.calFinal?'disabled':''}>${CALCOLS.map((c,i)=>`<option value="${i}" ${p.col===i?'selected':''}>${c}</option>`).join('')}</select></td><td>${p.rank||'- -'}</td></tr>`).join('')}</table></div></div>`;
 if(U.ctab==='dash')body=`<div class="body"><div class="intro" style="max-width:900px"><h3 style="margin-bottom:14px">Overall Form Rating distribution</h3>${CALCOLS.map((c,i)=>`<div style="display:grid;grid-template-columns:210px 1fr 90px;gap:12px;align-items:center;margin:8px 0"><span>${c}</span><div class="bar" style="height:14px;margin:0"><i style="width:${pc(by(i).length)}%;background:var(--blue-d)"></i></div><span>${by(i).length} (${pc(by(i).length)}%)</span></div>`).join('')}</div></div>`;
 return shell('calib',`<div style="background:#fff;border-bottom:1px solid var(--line);padding:24px 16px 0"><div style="display:flex;justify-content:space-between;padding:0 26px"><span><a href="#calib">Session List</a> / &nbsp;English Channel</span><span style="letter-spacing:14px">⏷◉▤⎙⇪↺</span></div><h1 style="font-size:34px;padding:14px 26px 22px">English Channel${S.calFinal?' <span class="vis" style="font-size:14px;font-weight:400">(Finalized)</span>':''}</h1>${tabs}</div><div style="padding-top:16px">${body}</div>
 <div class="foot"><button class="btn em" data-a="calsave" ${U.calDirty?'':'disabled'}>Save</button><button class="btn t" data-a="calfinal" ${S.calFinal?'disabled':''}>Finalize</button><button class="btn t" data-a="calundo" ${U.calDirty?'':'disabled'}>Undo</button></div>`);
}

/* ---------- dialogs ---------- */
function dialog(){
 const d=U.dlg;if(!d)return '';
 const wrap=(t,b,f,cls)=>`<div class="mask"><div class="dlg ${cls||'sm'}" role="dialog" aria-label="${t}"><header>${t}</header><div class="db" style="min-height:120px">${b}</div><footer>${f||''}<button class="btn t" data-a="close">${f?'Cancel':'Close'}</button></footer></div></div>`;
 if(d.k==='audit'){const g=G(d.id);return wrap('Goal Audit History',g.audit.length?`<table class="t"><tr><th>Date</th><th>Changed By</th><th>Change</th></tr>${g.audit.slice().reverse().map(a=>`<tr><td>${a.t}</td><td>${e(a.by)}</td><td>${e(a.w)}</td></tr>`).join('')}</table>`:'<p>No changes have been recorded for this goal in the sandbox.</p>')}
 if(d.k==='align'){const g=G(d.id),up=g.up&&G(g.up),dn=S.goals.filter(x=>x.up===g.id),bx=(x,l)=>`<div class="wc" style="margin:8px 0;border:1px solid var(--line)"><small>${l} · ${e(P[x.owner].name)}</small><br>${e(x.name)}</div>`;return wrap('Alignment Chart',(up?bx(up,'Aligned Up'):'')+bx(g,'This goal')+dn.map(x=>bx(x,'Aligned Down')).join(''))}
 if(d.k==='hist'){const f=S.forms.find(x=>x.id===d.id);return wrap('History',`<table class="t"><tr><th>Date</th><th>Event</th></tr>${f.hist.map(h=>`<tr><td>${h.t}</td><td>${e(h.w)}</td></tr>`).join('')}</table>`)}
 if(d.k==='act')return wrap('Create Activity',`<form data-f="act" data-id="${d.id}" id="actf"><label class="fl" for="an">Activity Name:<b>*</b></label><input class="fi" id="an" name="n" required maxlength="200"><label class="fl" for="as">Status:</label><select class="fi s" id="as" name="s"><option>In Progress</option><option>Complete</option></select></form>`,'<button class="btn em" form="actf">Save</button>');
 if(d.k==='mkform')return wrap('Create Form',`<form data-f="mkform" id="mkf"><label class="fl" for="mt">Template:</label><select class="fi s" id="mt" name="tpl">${Object.entries(TPL).map(([k,t])=>`<option value="${k}">${t.name}</option>`).join('')}</select><label class="fl" for="me">Employee:</label><select class="fi s" id="me" name="emp">${reports(ME).map(r=>`<option value="${r}">${e(P[r].name)}</option>`).join('')}</select></form>`,'<button class="btn em" form="mkf">Create</button>');
 if(d.k==='tna')return wrap('Create Development Goal',`<form data-f="tna" data-id="${d.id}" id="tnaf"><div class="err" id="terr" hidden></div><label class="fl" for="tn">🎓 Training Goal:<b>*</b></label><textarea class="fi" id="tn" name="name" maxlength="500" required></textarea><div class="cnt"><span data-cnt="tn">500</span> characters left Legal Scan Coaching Advisor</div>
  <label class="fl" for="tc">Category:</label><select class="fi s" id="tc"><option>🗂️ Training Needs Goals</option></select><label class="fl" for="tp">🛡️ Purpose:</label><select class="fi s" id="tp" name="purpose">${opt(PURPOSE)}</select><label class="fl" for="td">🏁 Target Date:</label><input class="fi s" type="date" id="td" name="due" value="2030-12-31"></form>`,'<button class="btn em" form="tnaf">Save</button>','');
 return '';
}

/* ---------- router ---------- */
function render(){
 const [a,b,c]=location.hash.slice(1).split('/');let h;
 if(a==='goal'&&b==='new')h=goalForm({plan:c==='dev'?'dev':'perf',owner:S.who,name:'',desc:'',metric:'',weight:'',start:c==='dev'?'2025-01-01':'2026-01-01',due:'2026-12-31',state:c==='dev'?'Not Started':'In Progress',done:0,vis:'Public',ms:[],comps:[],mgrapp:'No selection'},true);
 else if(a==='goal'&&G(b))h=c==='edit'?goalForm(G(b)):goalDetail(G(b));
 else if(a==='form'&&S.forms.find(f=>f.id===b))h=formPage(S.forms.find(f=>f.id===b));
 else if(a==='perf')h=perfPage(['inbox','enroute','completed'].includes(b)?b:'inbox');
 else if(a==='calib')h=calibPage();
 else h=goalsPage();
 document.getElementById('root').innerHTML=h+(U.casc?cascadeDlg():'')+dialog();
 save();
}
const go=h=>{if(location.hash==='#'+h)render();else location.hash=h};
window.addEventListener('hashchange',()=>{U.menu=false;U.card=null;render();window.scrollTo(0,0)});

/* ---------- actions ---------- */
const A={
 reset:()=>{S=seed();U.calDirty=false;go('goals');toast('Sandbox reset to seed data')},
 menu:()=>{U.menu=!U.menu;render()},
 go:el=>{U.menu=false;if(el.dataset.h.startsWith('perf'))U.ptab='reviews';go(el.dataset.h)},
 who:el=>{S.who=el.dataset.u;render()},
 gtab:el=>{S.gtab=el.dataset.t;render()},
 intro:()=>{S.intro=!S.intro;render()},
 full:()=>{U.full=!U.full;render()},
 print:()=>window.print(),
 card:(el,ev)=>{ev.stopPropagation();U.card=U.card===el.dataset.id?null:el.dataset.id;render()},
 open:(el,ev)=>{if(ev.target.closest('select'))return;go('goal/'+el.dataset.id)},
 edit:(el,ev)=>{ev.stopPropagation();U.ret=location.hash.slice(1);go('goal/'+el.dataset.id+'/edit')},
 new:()=>{U.ret=location.hash.slice(1);go('goal/new/'+S.gtab)},
 fnew:el=>{const f=S.forms.find(x=>x.id===el.dataset.id);S.who=f.emp;U.ret='form/'+f.id;go('goal/new/perf')},
 back:()=>go(U.ret||'goals'),
 del:(el,ev)=>{ev.stopPropagation();const g=G(el.dataset.id);if(g.plan==='perf'&&!canDelete(g.owner)){toast('Goals cannot be deleted in the “'+PSTATE[S.pstate[g.owner]]+'” state');return}
  if(!confirm('Delete this goal? This cannot be undone.'))return;S.goals=S.goals.filter(x=>x.id!==g.id);S.goals.forEach(x=>{if(x.up===g.id)x.up=null});toast('Goal deleted');if(location.hash.startsWith('#goal/'))go('goals');else render()},
 audit:el=>{U.dlg={k:'audit',id:el.dataset.id};render()},align:el=>{U.dlg={k:'align',id:el.dataset.id};render()},
 act:el=>{U.dlg={k:'act',id:el.dataset.id};render()},hist:el=>{U.dlg={k:'hist',id:el.dataset.id};render()},
 mkform:()=>{U.dlg={k:'mkform'};render()},
 tna:el=>{const f=S.forms.find(x=>x.id===el.dataset.id);if(formTna(f).length>=3){toast('A maximum of 3 training needs is allowed on this form');return}U.dlg={k:'tna',id:f.id};render()},
 close:()=>{U.dlg=null;U.casc=null;render()},
 msadd:()=>{const b=document.getElementById('msb');const n=b.querySelector('.nod');if(n)n.remove();b.insertAdjacentHTML('beforeend',goalForm.msrow({}))},
 msdel:el=>{const b=document.getElementById('msb');el.closest('tr').remove();if(!b.children.length)b.innerHTML='<tr class="nod"><td colspan="4" class="none">No Data</td></tr>'},
 cascade:()=>{U.casc={step:0,goals:[],rec:[],mode:'team',edits:{},ed:null,q:''};render()},
 cmode:el=>{U.casc.mode=el.dataset.m;render()},cpen:el=>{U.casc.ed=el.dataset.id;render()},
 cprev:()=>{U.casc.step--;render()},
 cnext:()=>{const c=U.casc;if(c.step<3){c.step++;c.ed=null;render();return}
  c.rec.forEach(r=>c.goals.forEach(id=>{const s=G(id);S.goals.push(Object.assign({},s,{id:'g'+(S.seq++),owner:r,name:c.edits[id]||s.name,done:0,state:'In Progress',acts:[],ms:[],up:id,updated:TODAY,audit:[{t:fmt(TODAY),by:P[ME].name,w:'Goal cascaded from '+P[ME].name}]}))}));
  U.casc=null;toast(`${c.goals.length} goal${c.goals.length>1?'s':''} cascaded to ${c.rec.length} recipient${c.rec.length>1?'s':''}`);render()},
 ptab:el=>{U.ptab=el.dataset.t;go('perf')},
 form:(el,ev)=>{if(ev.target.closest('input'))return;go('form/'+el.dataset.id)},
 noop:(el,ev)=>ev.stopPropagation(),
 exp:el=>{U.exp[el.dataset.id]=!U.exp[el.dataset.id];render()},
 jump:el=>{const s=document.getElementById(el.dataset.s);if(s)s.scrollIntoView({behavior:'smooth'})},
 ctab:el=>{U.ctab=el.dataset.t;render()},
 calsave:()=>{U.calDirty=false;U.calSnap=null;toast('Session saved');render()},
 calundo:()=>{if(U.calSnap){S.cal=JSON.parse(U.calSnap);U.calSnap=null}U.calDirty=false;render()},
 calfinal:()=>{if(!confirm('Finalize this session? Ratings will be written back to the forms and the session becomes read-only.'))return;S.calFinal=true;U.calDirty=false;toast('Session finalized');render()}
};
function calMove(pid,col){const p=S.cal.find(x=>x.id===pid);if(!p||p.col===col||S.calFinal)return;if(!U.calSnap)U.calSnap=JSON.stringify(S.cal);p.col=col;U.calDirty=true;render()}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-a]');if(!el){if(U.menu||U.card){U.menu=false;U.card=null;render()}return}const f=A[el.dataset.a];if(f)f(el,ev)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&(U.dlg||U.casc||U.menu||U.card)){U.dlg=U.casc=U.card=null;U.menu=false;render()}});
document.addEventListener('input',ev=>{const t=ev.target;const c=t.id&&document.querySelector(`[data-cnt="${t.id}"]`);if(c)c.textContent=t.maxLength-t.value.length;
 if(t.dataset.in==='csearch'){U.casc.q=t.value;render();const i=document.querySelector('[data-in=csearch]');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
document.addEventListener('change',ev=>{const t=ev.target,k=t.dataset.chg;if(!k)return;const c=U.casc;
 if(k==='gstate'){const g=G(t.dataset.id);aud(g,`Status: ${g.state} → ${t.value}`);g.state=t.value;g.updated=TODAY;render()}
 if(k==='pstate'){S.pstate[S.who]=t.value;toast('Plan state changed to '+PSTATE[t.value]);render()}
 if(k==='cgoal'){c.goals=t.checked?[...c.goals,t.value]:c.goals.filter(x=>x!==t.value);render()}
 if(k==='call'){c.goals=t.checked?plan(ME,'perf').map(g=>g.id):[];render()}
 if(k==='crec'){c.rec=t.checked?[...c.rec,t.value]:c.rec.filter(x=>x!==t.value);render()}
 if(k==='crall'){c.rec=t.checked?reports(ME):[];render()}
 if(k==='frating'){S.forms.find(f=>f.id===t.dataset.id).rating=t.value;const cm=document.getElementById('fcm');if(cm)S.forms.find(f=>f.id===t.dataset.id).comments=cm.value;render()}
 if(k==='calcol')calMove(t.dataset.pid,+t.value)});
document.addEventListener('dragstart',ev=>{const p=ev.target.closest&&ev.target.closest('.cp');if(p)ev.dataTransfer.setData('text/plain',p.dataset.pid)});
document.addEventListener('dragover',ev=>{const c=ev.target.closest&&ev.target.closest('.col');if(c){ev.preventDefault();c.classList.add('drop')}});
document.addEventListener('dragleave',ev=>{const c=ev.target.closest&&ev.target.closest('.col');if(c)c.classList.remove('drop')});
document.addEventListener('drop',ev=>{const c=ev.target.closest&&ev.target.closest('.col');if(c){ev.preventDefault();calMove(ev.dataTransfer.getData('text/plain'),+c.dataset.col)}});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target,fd=new FormData(f),k=f.dataset.f;
 const fail=(id,m)=>{const x=document.getElementById(id);x.textContent=m;x.hidden=false;x.scrollIntoView({block:'center'})};
 if(k==='goal'){const dev=f.dataset.plan==='dev',isNew=!f.dataset.id;const g=isNew?{id:(dev?'d':'g')+(S.seq++),plan:f.dataset.plan,owner:S.who,acts:[],audit:[],ms:[],learn:[],comments:[],comps:[],up:null,mgrapp:'No selection',done:0,weight:0,metric:'',desc:''}:G(f.dataset.id);
  const v=n=>fd.has(n)?String(fd.get(n)).trim():g[n];
  if(!v('name'))return fail('gerr',(dev?'Name':'Goal Description')+' is required.');
  if(!dev){if(!v('metric'))return fail('gerr','Key Performance Indicator is required.');const w=+v('weight');if(!(w>=1&&w<=50))return fail('gerr','Weight must be within the range of 1% to 50%.');g.weight=w;g.metric=v('metric');
   if(fd.has('mt')){const t=fd.getAll('mt'),d=fd.getAll('md'),a=fd.getAll('ma');g.ms=t.map((x,i)=>({t:x,d:d[i],a:a[i]})).filter(m=>m.t||m.d||m.a)}else if(!locked(g,'ms'))g.ms=[]}
  else{g.comps=fd.getAll('comps');if(fd.has('mgrapp'))g.mgrapp=fd.get('mgrapp')}
  g.name=v('name');g.desc=v('desc');g.vis=v('vis')||g.vis||'Public';g.start=v('start');g.due=v('due');g.state=v('state');g.done=Math.max(0,Math.min(100,+v('done')||0));g.updated=TODAY;
  aud(g,isNew?'Goal created':'Goal edited');if(isNew)S.goals.push(g);
  const tw=plan(g.owner,'perf').reduce((a,x)=>a+(+x.weight||0),0);toast(dev||tw===100?'Goal saved':`Goal saved. Total weight is ${tw}%; it must total 100%.`);go(U.ret||'goals')}
 if(k==='cedit'){U.casc.edits[f.dataset.id]=String(fd.get('t')).trim()||G(f.dataset.id).name;U.casc.ed=null;render()}
 if(k==='comment'){const x=String(fd.get('x')).trim();if(!x)return;G(f.dataset.id).comments.push({by:P[ME].name,t:fmt(TODAY),x});render()}
 if(k==='act'){G(f.dataset.id).acts.unshift({n:fd.get('n'),s:fd.get('s'),c:'today'});U.dlg=null;render()}
 if(k==='mkform'){const tpl=fd.get('tpl');S.forms.unshift({id:'f'+(S.seq++),tpl,emp:fd.get('emp'),step:tpl==='goal'?1:0,status:'inbox',assigned:TODAY,start:TODAY,rating:'',comments:'',hist:[{t:mdy(TODAY),w:'Form created by '+P[ME].name}]});U.dlg=null;toast('Form created');go('perf')}
 if(k==='tna'){const fm=S.forms.find(x=>x.id===f.dataset.id),name=String(fd.get('name')).trim();if(!name)return fail('terr','Training Goal is required.');
  S.goals.push({id:'t'+(S.seq++),plan:'tna',owner:fm.emp,name,purpose:fd.get('purpose'),due:fd.get('due'),audit:[]});U.dlg=null;render()}
 if(k==='pform'){const fm=S.forms.find(x=>x.id===f.dataset.id),act=ev.submitter?ev.submitter.value:'save',ap=fm.tpl==='appr';
  if(ap){fm.rating=fd.get('rating')||fm.rating;fm.comments=String(fd.get('comments')||'')}
  if(act==='save'){toast('Form saved');render();return}
  if(act==='close'){toast('Form saved');go('perf');return}
  if(ap){if(!fm.rating)return fail('ferr','Overall Form Rating is required before the form can move to the next step.');if(!fm.comments.trim())return fail('ferr','Section Comments are required before the form can move to the next step.')}
  else{const gs=formGoals(fm),tw=gs.reduce((a,g)=>a+(+g.weight||0),0);if(!gs.length)return fail('ferr','At least one goal is required.');if(tw!==100)return fail('ferr',`The total weight of the goals is ${tw}%. It must total 100%.`);if(gs.some(g=>g.weight<1||g.weight>50))return fail('ferr','Each goal weight must be within the range of 1% to 50%.')}
  fm.status='completed';fm.hist.push({t:mdy(TODAY),w:(ap?'DLM Appraisal':'DLM Goals Review')+' completed by '+P[ME].name});
  if(!ap){S.pstate[fm.emp]='locked';fm.hist.push({t:mdy(TODAY),w:'Goal plan state changed to Goals Completed'})}
  toast('Form completed');go('perf')}
});
render();
