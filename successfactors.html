<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJMN SuccessFactors Replica Sandbox</title>
<style>
/* A replica of AJMN's current SuccessFactors setup (goal plan 14, development plans 2004 and 2005, the 2026 forms, calibration), with synthetic data and a simulated SAP adapter. */
:root{--hdr:#243267;--blue:#8FAEDD;--blue-d:#7C9FD6;--ink:#1D2D3E;--ink2:#131E29;--muted:#556B82;--line:#D9DDE3;--bg:#F5F6F7;--card:#FFFFFF;--link:#0064D9;--sel:#EBF1FA;
 --green:#30914C;--yellow:#B89B00;--red:#C0392B;--amber:#F0A93B;--amber-soft:#FFF6E5}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "72","72full",Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:"72 Black","72",Arial,Helvetica,sans-serif;font-weight:900;color:var(--ink2);letter-spacing:-.01em}
h1{font-size:26px;line-height:1.15}h2{font-size:22px}h3{font-size:16px;font-weight:700}
a{color:var(--link);text-decoration:none}
:focus-visible{outline:2px solid #0032A5;outline-offset:1px}
.sand{background:var(--amber-soft);border-bottom:1px solid #F3D9A6;padding:5px 16px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.sand b{background:var(--amber);border-radius:4px;padding:1px 7px;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.sand .sp{flex:1}
.sand button{border:1px solid #E6C68A;background:#fff;border-radius:5px;padding:3px 9px;cursor:pointer}
.hdr{background:var(--hdr);color:#fff;height:68px;display:flex;align-items:center;gap:20px;padding:0 48px 0 60px;position:relative}
.logo{width:38px;height:38px;background:#fff;color:var(--hdr);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex:none}
.mod{background:none;border:0;color:#fff;font-weight:700;font-size:16px;cursor:pointer;padding:8px 10px;margin-left:16px}
.modmenu{position:absolute;top:58px;left:120px;background:#fff;color:var(--ink);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:30;min-width:200px;padding:6px 0}
.modmenu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 16px;cursor:pointer}
.modmenu button:hover{background:var(--sel)}
.hdr .sp{flex:1}
.hsearch{flex:0 1 400px;min-width:120px;height:36px;border-radius:18px;border:1px solid #6F7FB5;background:transparent;color:#fff;padding:0 14px;font-style:italic}
.hsearch::placeholder{color:#fff;opacity:.9}
.hico{width:36px;height:36px;border:0;background:none;color:#fff;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;flex:none}
.hico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.hico i{position:absolute;top:0;right:-2px;background:#C0392B;border-radius:8px;font-size:10px;font-style:normal;font-weight:700;padding:0 4px;line-height:14px}
.av{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--hdr);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.sub{background:#A8B1CC;display:flex;gap:36px;padding:0 40px;height:30px;align-items:center}
.sub button{border:0;background:none;color:#fff;font-weight:700;cursor:pointer;padding:0;font-size:14px}
.sub button[aria-current]{color:var(--ink2);text-decoration:underline}
.wrap{display:flex;min-height:calc(100vh - 100px)}
.side{width:350px;flex:none;background:#fff;border-right:1px solid var(--line)}
.side h2{padding:14px 10px 10px;font-size:20px}
.side .srch{margin:4px 10px 8px;position:relative}
.side .srch input{width:100%;height:26px;border:1px solid #8996A8;border-radius:4px;padding:0 8px;font-style:italic}
.side label.chk{display:flex;gap:8px;align-items:center;padding:4px 16px 12px}
.pp{display:flex;align-items:center;gap:14px;width:100%;border:0;border-top:1px solid var(--line);background:#fff;padding:12px 20px 12px 10px;text-align:left;cursor:pointer;min-height:72px}
.pp:hover,.pp[aria-current]{background:var(--sel)}
.pp .pa{width:46px;height:46px;border-radius:50%;background:#D5E5F9;color:#1B62C4;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.pp .pn{flex:1;min-width:0}.pp .pn small{display:block;font-size:14px}
.pp::after{content:"›";color:var(--muted);font-size:20px}
.side .grp{font-weight:700;padding:16px 10px 10px;border-top:1px solid var(--line)}
.side .nv{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:700}
.side .nv.in{padding-left:38px;font-weight:400}
.side .nv[aria-current]{background:var(--bg);box-shadow:inset 3px 0 0 var(--ink2)}
.main{flex:1;min-width:0}
.tabsbar{background:#fff;border-bottom:1px solid var(--line);display:flex;gap:26px;padding:0 34px}
.tabsbar button{border:0;background:none;font-weight:700;padding:12px 2px 10px;cursor:pointer;border-bottom:3px solid transparent}
.tabsbar button[aria-selected=true]{border-bottom-color:var(--ink2)}
.ph{background:#fff;padding:10px 16px 0 32px;border-bottom:1px solid var(--line);position:relative}
.ph .r1{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.ph .r1 h1{margin-right:20px}
.ph .sp{flex:1}
.ph .dt{padding:10px 0;display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.btn{height:26px;padding:0 9px;border-radius:6px;border:1px solid #BCC3CA;background:#E9ECEF;font-weight:700;cursor:pointer;white-space:nowrap}
.btn.em{background:var(--blue);border-color:var(--blue)}
.btn.em:hover{background:var(--blue-d)}
.btn.t{background:none;border-color:transparent}
.btn.t:hover{background:#E9ECEF}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.kpis{display:flex;gap:0 44px;padding:14px 20px 0;flex-wrap:wrap}
.kpis div{padding-bottom:8px;font-weight:700}
.kpis div b{display:block;font-size:13px}
.kpis div:first-child{border-right:1px solid var(--line);padding-right:22px;margin-right:-22px;box-shadow:inset 0 -3px 0 var(--ink2)}
.kpis .w{margin-left:auto;text-align:right;font-weight:400}
.body{padding:16px 16px 60px 32px}
.sect{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;padding:10px 0;cursor:pointer;border:0;background:none}
.intro{background:#fff;border-radius:10px;padding:14px 18px;margin:4px 0 10px;max-width:1100px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:6px}
.gc{background:#fff;border-radius:12px;box-shadow:0 0 0 1px #E3E6EA,0 2px 6px rgba(34,53,72,.12);padding:16px 16px 12px;position:relative;cursor:pointer}
.gc .gt{font-size:16px;line-height:1.2;height:38px;overflow:hidden;padding-right:40px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.gc .dots{position:absolute;top:10px;right:12px;border:0;background:none;font-weight:900;font-size:18px;cursor:pointer;letter-spacing:1px;padding:4px 8px}
.gc .due{margin:8px 0 18px}
.gc .pc{display:flex;justify-content:space-between}
.bar{height:4px;background:#D5DADD;border-radius:2px;margin:2px 0 10px}
.bar i{display:block;height:100%;background:var(--ink2);border-radius:2px}
.gc .ft{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.stsel{border:0;background:none;padding:0;cursor:pointer;font-size:14px}
.pop{position:absolute;right:10px;top:40px;background:#fff;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:10;padding:4px 0;min-width:150px}
.pop button{display:block;width:100%;border:0;background:none;text-align:left;padding:8px 14px;cursor:pointer}
.pop button:hover{background:var(--sel)}
.crumb{padding:18px 22px 0;font-size:14px}
.dh{background:#fff;border-bottom:1px solid var(--line);padding:0 22px 14px}
.dh .tl{display:flex;gap:16px;align-items:flex-start;padding-top:12px}
.dh .tl h1{flex:1}
.dh .vis{font-family:Arial,Helvetica,sans-serif;font-weight:400;font-size:14px;color:var(--muted);margin-left:8px}
.facts{display:flex;flex-wrap:wrap;margin-top:12px}
.facts div{padding:0 16px;border-right:1px solid var(--line)}
.facts div:first-child{padding-left:0}.facts div:last-child{border:0}
.facts small{display:block;font-size:14px;margin-bottom:6px}
.facts span,.facts select{font-size:20px}
.dgrid{display:flex;gap:24px;padding:18px 22px 60px 10px;align-items:flex-start;flex-wrap:wrap}
.dgrid .l{flex:1 1 560px;min-width:0}.dgrid .r{flex:0 1 380px}
.sh{display:flex;align-items:center;gap:14px;padding:14px 22px;font-weight:700;font-size:16px}
.sh .sp{flex:1}
.sh button.x{border:0;background:none;cursor:pointer;font-weight:700;font-size:14px}
.sb{background:#fff;border-radius:10px;padding:10px 16px;margin-bottom:6px}
.act{border-left:5px solid var(--green);padding:8px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.act.c{border-left-color:#3F8CD0}
.act small{display:block}
.r p{margin:4px 0 12px}
.formp{background:#fff;border-radius:12px;margin:16px 14px 80px;padding:22px 16px}
.fl{display:block;font-weight:400;margin:18px 0 8px}
.fl b{color:#BB0000;font-weight:400}
.fi{width:100%;max-width:1040px;border:1px solid #8996A8;border-radius:4px;padding:4px 8px;min-height:26px;background:#fff}
textarea.fi{min-height:90px;resize:vertical;display:block}
.fi.s{max-width:512px}
.fi[disabled]{background:#F0F1F2;color:var(--muted)}
.cnt{max-width:1040px;text-align:right;font-size:12px;margin-top:6px}
.two{display:flex;gap:16px;max-width:1040px}.two>div{flex:1}
table.t{border-collapse:collapse;width:100%}
.t th{background:var(--blue);text-align:left;padding:8px 14px;font-weight:700;white-space:nowrap}
.t td{padding:7px 14px;border-bottom:1px solid var(--line);background:#fff}
.t tr.cl{cursor:pointer}.t tr.cl:hover td{background:var(--sel)}
.t td.none{text-align:center}
.foot{position:fixed;left:0;right:0;bottom:0;background:#fff;border:1px solid #6A7786;border-radius:10px 10px 0 0;padding:8px 22px;display:flex;justify-content:flex-end;gap:8px;z-index:15}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{background:#F5F6F7;border-radius:12px;width:min(1380px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.dlg.sm{width:min(720px,100%)}
.dlg>header{background:#C9CCD0;padding:10px 32px;font-weight:700;font-size:15px}
.dlg>footer{background:#fff;border-top:1px solid var(--line);padding:10px 56px 10px 16px;display:flex;justify-content:flex-end;gap:10px}
.dlg .db{overflow:auto;padding:16px 32px;min-height:340px}
.steps{background:#fff;display:flex;padding:14px 36px;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.steps div{display:flex;align-items:center;gap:8px;font-weight:700;flex:1}
.steps div:last-child{flex:none}
.steps div b{width:30px;height:30px;border-radius:50%;border:1px solid #8996A8;display:inline-flex;align-items:center;justify-content:center;font-weight:400;flex:none}
.steps div.on b{background:#000;color:#fff;border-color:#000}
.steps div::after{content:"";flex:1;height:1px;background:var(--line);min-width:10px}
.steps div.done::after{background:#000}
.steps div:last-child::after{display:none}
.steps small{display:block;font-weight:400;font-size:12px}
.wc{background:#fff;border-radius:10px;padding:16px}
.wr{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--ink2)}
.wr.lite{border-bottom-color:var(--line);justify-content:space-between}
.seg{display:flex;justify-content:center;margin:10px 0}
.seg button{border:1px solid #8996A8;background:#D5DADD;padding:3px 14px;font-weight:700;cursor:pointer}
.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.seg button[aria-pressed=true]{background:#fff;box-shadow:0 0 0 2px #000 inset}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 16px;padding:14px 0}
.filters label{display:block}.filters select,.filters input{display:block;width:100%;height:26px;border:1px solid #8996A8;border-radius:4px;margin-top:6px;background:#fff}
.fnav{width:340px;flex:none;background:#fff;border-radius:12px;margin:16px 0 16px 4px;padding:8px;align-self:flex-start;position:sticky;top:10px}
.fnav button{display:block;width:100%;text-align:left;border:0;background:none;font-weight:700;padding:10px 16px;cursor:pointer}
.fnav button:first-child{background:var(--bg);box-shadow:inset -3px 0 0 var(--ink2)}
.fsec{margin:22px 22px 0 28px}
.fsec h2{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.fsec h2 .sp{flex:1}
.fsec h2 button{border:0;background:none;font-size:22px;cursor:pointer}
.desc{background:#fff;border-radius:16px;box-shadow:0 0 0 1px #E3E6EA,0 1px 4px rgba(34,53,72,.15);padding:6px 20px;margin-bottom:10px}
.desc summary{font-weight:700;font-size:16px;cursor:pointer;padding:2px 0}
.tw{border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px #E3E6EA,0 1px 4px rgba(34,53,72,.15)}
.ib{border:0;background:none;cursor:pointer;font-size:16px;padding:2px 6px}
.info{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px 16px;background:#fff;border-radius:12px;padding:16px;box-shadow:0 0 0 1px #E3E6EA,0 1px 4px rgba(34,53,72,.15)}
.info small{display:block;font-size:14px;margin-bottom:6px}
.score{background:#fff;border-radius:12px;box-shadow:0 0 0 1px #E3E6EA;padding:22px 20px;text-align:right;font-weight:700;font-size:20px;margin-top:26px}
.warn{background:#FEF7D9;border:1px solid #E9D48A;border-radius:8px;padding:8px 14px;margin:0 16px 14px}
.cal{display:flex;gap:26px;padding:0 16px 80px;overflow-x:auto;align-items:flex-start}
.col{flex:0 0 206px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:0 14px 8px;min-height:300px}
.col.drop{outline:2px dashed #0064D9}
.col h3{margin:4px -14px 8px;padding:0 20px 8px;border-bottom:1px solid var(--line);font-family:inherit;font-weight:700}
.col h3 small{display:block;font-weight:400;color:var(--muted);font-size:14px;margin-top:4px}
.col .nh{background:var(--blue);font-weight:700;padding:14px 24px}
.cp{border-bottom:1px solid var(--line);padding:12px 6px 8px 18px;cursor:grab}
.cp .n{display:flex;align-items:center;gap:8px}
.cp .n i{width:22px;height:22px;border-radius:50%;background:#9AA5B1;flex:none}
.cp .n span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp .rk{font-weight:700;margin-top:18px}.cp .rk span{font-weight:400}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:var(--ink2);color:#fff;border-radius:8px;padding:10px 16px;z-index:60}
.err{color:#BB0000;margin:8px 0}
@media(max-width:900px){.side,.fnav{display:none}.hdr{padding:0 12px}.info{grid-template-columns:repeat(2,minmax(0,1fr))}.body,.ph{padding-left:14px}}
@media print{.hdr,.sand,.side,.sub,.foot{display:none}}
/* 2026 goal plan parity additions */
code{font:12px ui-monospace,Menlo,Consolas,monospace;background:#EEF0F2;border-radius:4px;padding:1px 5px}
.sand label{display:inline-flex;gap:5px;align-items:center}
.sand select{border:1px solid #E6C68A;background:#fff;border-radius:5px;padding:2px 4px}
.lng button{border-radius:0;margin:0}.lng button:first-child{border-radius:5px 0 0 5px}.lng button:last-child{border-radius:0 5px 5px 0;border-left:0}
.lng button[aria-pressed=true]{background:var(--ink2);color:#fff;border-color:var(--ink2)}
.strow{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue-d);border-radius:8px;padding:9px 14px;margin:0 0 10px;max-width:1100px}
.note div+div{color:var(--muted);margin-top:4px;font-size:13px}
.note.dr{border-left-color:var(--amber);background:var(--amber-soft)}
.ready{background:#F1F9F3;border:1px solid #BFE0C8;border-radius:8px;padding:9px 14px;margin:0 0 10px;max-width:1100px}
.ready.bad{background:#FEF7D9;border-color:#E9D48A}
.ready ul,.ebox ul{margin:6px 0 2px;padding-inline-start:20px}
.badge{display:inline-block;background:var(--amber-soft);border:1px solid #E6C68A;border-radius:10px;padding:0 8px;font-size:11.5px;color:var(--ink);font-weight:400}
.lk{color:var(--muted);font-size:12.5px;margin:5px 0 0;max-width:1040px}
.ferr{color:#BB0000;font-weight:700;margin:5px 0 0}
.fi[aria-invalid=true]{border-color:#BB0000;box-shadow:0 0 0 1px #BB0000}
.ebox{background:#FFF1F0;border:1px solid #E7A9A4;border-radius:8px;padding:10px 14px;margin:0 0 6px;max-width:1040px}
.aibox{background:#F4F1FB;border:1px solid #CFC4EC;border-radius:8px;padding:10px 14px;margin:8px 0 0;max-width:1040px}
.aibox blockquote{margin:6px 0 10px;padding:6px 10px;background:#fff;border-radius:6px}
.abox{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0;display:flex;flex-direction:column;gap:3px}
.abox small{color:var(--muted);font-size:12.5px}.abox span{font-size:13px}
.abox.st{border-left:4px solid var(--hdr)}
.abox.me{padding:0;border:2px solid var(--ink2)}.abox.me .abox{border:0;margin:0}
.arr{text-align:center;color:var(--muted);line-height:1}
.lnk{border:0;background:none;color:var(--link);cursor:pointer;font-weight:700;padding:2px 0;margin-inline-end:14px}
.lnks{margin-top:12px}
[dir=rtl] .modmenu button,[dir=rtl] .pop button,[dir=rtl] .pp,[dir=rtl] .side .nv,[dir=rtl] .fnav button,[dir=rtl] .t th{text-align:right}
[dir=rtl] .cnt{text-align:left}
[dir=rtl] .kpis .w{margin-left:0;margin-right:auto;text-align:left}
[dir=rtl] .gc .dots{right:auto;left:12px}[dir=rtl] .gc .gt{padding-right:0;padding-left:40px}
[dir=rtl] .pop{right:auto;left:10px}
[dir=rtl] .side{border-right:0;border-left:1px solid var(--line)}
[dir=rtl] .note{border-left:1px solid var(--line);border-right:4px solid var(--blue-d)}
[dir=rtl] .pp::after{content:"‹"}
[dir=rtl] .facts div{border-right:0;border-left:1px solid var(--line)}
/* Admin Center */
.adm{max-width:1320px}.adm .fi{max-width:none}
.asrch{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:8px 0 6px}
.cath{margin:22px 0 10px;font-weight:700}.cath small{color:var(--muted);font-weight:400}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tool{background:#fff;border-radius:12px;box-shadow:0 0 0 1px #E3E6EA,0 2px 6px rgba(34,53,72,.1);padding:12px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;position:relative}
.tool:hover{box-shadow:0 0 0 2px var(--blue-d)}
.tool.off{cursor:default;background:#FAFAFB}.tool.off .tic{background:#EEF0F2;color:var(--muted)}.tool.off b{color:var(--muted)}.tool.off:hover{box-shadow:0 0 0 1px #E3E6EA}
.tic{width:40px;height:40px;border-radius:10px;background:var(--sel);color:var(--hdr);display:flex;align-items:center;justify-content:center;flex:none}
.tic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;align-items:flex-start}.tx small{color:var(--muted);font-size:12.5px}
.badge.ok{background:#F1F9F3;border-color:#BFE0C8}
.star{border:0;background:none;font-size:20px;cursor:pointer;color:#B88700;padding:0 4px;line-height:1}
.rm{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.rmb{background:#fff;border:1px solid #8996A8;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:3px;min-width:150px;max-width:220px}
.rmb small{color:var(--muted);font-size:12px}.rmb span{font-size:12.5px}
.rmb.on{border:2px solid var(--ink2);background:var(--sel)}.rmb.end{border-style:dashed}.rmb.off{opacity:.55;border-style:dotted}
.rma{align-self:center;font-style:normal;color:var(--muted);font-size:20px}

function aiSim(act,t){const ar=/[؀-ۿ]/.test(t),sent=t.split(/(?<=[.!?؟])\s+|\n+/).map(x=>x.trim()).filter(Boolean),dot=x=>/[.!?؟]$/.test(x)?x:x+'.';
 if(act==='improve'){let x=sent.map(s=>dot(ar?s:s[0].toUpperCase()+s.slice(1))).join(' ');if(!ar)[[/\ba lot of\b/gi,'a great deal of'],[/\bgood job\b/gi,'strong results'],[/\bvery good\b/gi,'excellent'],[/\bstuff\b/gi,'work'],[/\bgot\b/gi,'achieved'],[/\bbig\b/gi,'significant']].forEach(([a,b])=>x=x.replace(a,b));return{text:x}}
 if(act==='shorter')return{text:dot(sent.slice(0,Math.max(1,Math.ceil(sent.length/2))).join(' '))};
 if(act==='bullets')return{text:sent.map(s=>'• '+s.replace(/[.]$/,'')).join('\n')};
 if(act==='translate'){const p=PAIRS.find(x=>x.en===t||x.ar===t);return p?{text:ar?p.en:p.ar}:{text:null,note:'The simulated service translates only the sandbox sample comment and comments drafted by Performance Insights, word for word as generated.'}}
 if(act==='analyze'){const flags=BIAS.filter(([re])=>re.test(t)).map(([re,why,sug])=>({term:t.match(re)[0],why,sug}));let x=t;BIAS.forEach(([re,,sug])=>x=x.replace(re,sug));return{flags,text:flags.length?x:null,note:flags.length?'':'No potentially biased or harmful terms found.'}}
 return{text:t}}

 if(t.closest&&t.closest('form[data-plan=perf]')){draftNow();if(t.id==='weight'){const w=document.getElementById('wtot');w.textContent=wtText(+w.dataset.oth,+t.value||0)}}
 if(t.dataset.in==='asearch'){U.aq=t.value;render();const i=document.querySelector('[data-in=asearch]');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
 if(t.dataset.in==='csearch'){U.casc.q=t.value;render();const i=document.querySelector('[data-in=csearch]');i.focus();i.setSelectionRange(i.value.length,i.value.length)}});
document.addEventListener('change',ev=>{const t=ev.target,k=t.dataset.chg,c=U.casc;
 if(t.id==='state'&&t.closest('form[data-plan=perf]'))document.getElementById('trg').hidden=t.value!=='On Track';
 if(t.dataset.cfg){cfgChange(t);return}
 if(!k)return;
 if(k==='aon'){U.aon=t.checked;render()}
 if(k==='me'){S.me=ME=t.value;S.who=ME;U.casc=U.dlg=U.ferr=null;go(location.hash.startsWith('#perf')||location.hash.startsWith('#form')?'perf':location.hash.startsWith('#parity')?'parity':location.hash.startsWith('#admin')?location.hash.slice(1):'goals')}
 if(k==='fail'){U.failNext=t.checked}
 if(k==='aifail'){U.aiFail=t.checked}
 if(k==='aprev'){U.aprev=t.value;render()}
 if(k==='cfg'){S.cfg[t.dataset.k]=t.checked;render()}
 if(k==='gstate'){const g=G(t.dataset.id);if(g.plan==='perf'){const r=SAP.save(ME,{id:g.id,state:t.value});if(!r.ok)toast(why(r))}else{aud(g,`Status: ${g.state} → ${t.value}`);g.state=t.value;g.updated=TODAY}render()}
 if(k==='cgoal'){c.goals=t.checked?[...c.goals,t.value]:c.goals.filter(x=>x!==t.value);render()}
 if(k==='call'){c.goals=t.checked?plan(ME,'perf').map(g=>g.id):[];render()}
 if(k==='crec'){c.rec=t.checked?[...c.rec,t.value]:c.rec.filter(x=>x!==t.value);render()}
 if(k==='crall'){const el=SAP.eligible(ME);c.rec=t.checked?reports(ME).filter(r=>el.includes(r)):[];render()}
 if(k==='frating'){keepCm(t.dataset.id);const r=SAP.formField(ME,t.dataset.id,'rating',t.value);if(!r.ok)toast(why(r));render()}
 if(k==='calcol')calMove(t.dataset.pid,+t.value)});
document.addEventListener('dragstart',ev=>{const p=ev.target.closest&&ev.target.closest('.cp');if(p)ev.dataTransfer.setData('text/plain',p.dataset.pid)});
document.addEventListener('dragover',ev=>{const c=ev.target.closest&&ev.target.closest('.col');if(c){ev.preventDefault();c.classList.add('drop')}});
document.addEventListener('dragleave',ev=>{const c=ev.target.closest&&ev.target.closest('.col');if(c)c.classList.remove('drop')});
document.addEventListener('drop',ev=>{const c=ev.target.closest&&ev.target.closest('.col');if(c){ev.preventDefault();calMove(ev.dataTransfer.getData('text/plain'),+c.dataset.col)}});
document.addEventListener('submit',ev=>{ev.preventDefault();const f=ev.target,fd=new FormData(f),k=f.dataset.f;
 const fail=(id,m)=>{const x=document.getElementById(id);x.textContent=m;x.hidden=false;x.scrollIntoView({block:'center'})};
 if(k==='goal'&&f.dataset.plan==='perf'){const key=f.dataset.key,p=readForm(f),isNew=!f.dataset.id;S.drafts[key]={at:Date.now(),v:p};
  const aig=isNew&&U.aig&&U.aig.key===key&&U.aig.res?U.aig:null,lk=document.getElementById('ailink');
  const r=SAP.save(ME,Object.assign({},p,isNew?{owner:f.dataset.owner}:{id:f.dataset.id},aig?{aiAssist:true}:{}));
  if(!r.ok){U.ferr=Object.assign({key},r);render();const x=document.querySelector('[aria-invalid=true]')||document.querySelector('.ebox');if(x){x.focus&&x.focus();x.scrollIntoView({block:'center'})}return}
  if(aig&&aig.res.prio&&lk&&lk.checked){const l=SAP.linkPrio(ME,r.goal.id,aig.res.prio);if(!l.ok)toast(why(l))}U.aig=null;
  U.ferr=U.ai=null;toast(tr('saved')+(r.warn.length?' · '+r.warn.map(w=>tr(w)).join(' '):''));go(U.ret||'goals');return}
 if(k==='goal'){const isNew=!f.dataset.id,g=isNew?{id:'d'+(S.seq++),plan:'dev',planId:2005,owner:S.who,acts:[],audit:[],learn:[],comments:[],comps:[],mgrapp:'No selection',done:0,desc:''}:G(f.dataset.id);
  const v=n=>fd.has(n)?String(fd.get(n)).trim():g[n];
  if(!v('name'))return fail('gerr','Name is required.');
  g.comps=fd.getAll('comps');if(fd.has('mgrapp'))g.mgrapp=fd.get('mgrapp');
  g.name=v('name');g.desc=v('desc');g.vis=v('vis')||g.vis||'Public';g.start=v('start');g.due=v('due');g.state=v('state');g.done=Math.max(0,Math.min(100,+v('done')||0));g.updated=TODAY;
  aud(g,isNew?'Goal created':'Goal edited');if(isNew)S.goals.push(g);toast('Goal saved');go(U.ret||'goals')}
 if(k==='link'){const r=SAP.link(ME,f.dataset.id,fd.get('up'));U.dlg=null;if(!r.ok)toast(why(r));render()}
 if(k==='prio'){const r=SAP.linkPrio(ME,f.dataset.id,fd.get('p'));U.dlg=null;if(!r.ok)toast(why(r));render()}
 if(k==='cedit'){U.casc.edits[f.dataset.id]=String(fd.get('t')).trim()||G(f.dataset.id).name;U.casc.ed=null;render()}
 if(k==='comment'){const x=String(fd.get('x')).trim();if(!x)return;G(f.dataset.id).comments.push({by:P[ME].name,t:fmt(TODAY),x});render()}
 if(k==='act'){G(f.dataset.id).acts.unshift({n:fd.get('n'),s:fd.get('s'),c:'today'});U.dlg=null;render()}
 if(k==='mkform'){const r=SAP.formCreate(ME,fd.get('tpl'),fd.get('emp'));U.dlg=null;toast(r.ok?'Form created at '+fstep(r.form).name:'This employee already has an open Individual Goal Form.');go('perf')}
 if(k==='tna'){const r=SAP.addTna(ME,f.dataset.id,{name:fd.get('name'),purpose:fd.get('purpose'),due:fd.get('due')});if(!r.ok)return fail('terr',why(r));U.dlg=null;render()}
 if(k==='publish'){const r=SAP.publish(ME,fd.get('note'));if(!r.ok)return fail('perr',r.code==='CONFIG_INVALID'?'Fix these before publishing: '+r.errors.join(' · '):r.code==='NOTE_REQUIRED'?'Add a short note saying what changed.':why(r));U.dlg=null;toast('Published as version '+r.n);render()}
 if(k==='launch'){const r=SAP.launch(ME,fd.get('tpl'),fd.getAll('emp'));if(!r.ok){toast(r.code==='NO_EMPLOYEES'?'Select at least one employee.':why(r));return}
  const ok=r.forms.filter(x=>x.ok),no=r.forms.filter(x=>!x.ok);toast(`${ok.length} form(s) launched`+(no.length?` · ${no.length} skipped: an open Individual Goal Form already exists`:''));render()}
 if(k==='pform'){const fm=form(f.dataset.id),act=ev.submitter?ev.submitter.value:'save';
  if(fd.has('rating'))SAP.formField(ME,fm.id,'rating',fd.get('rating'));if(fd.has('comments'))SAP.formField(ME,fm.id,'comments',fd.get('comments'));
  if(act==='save'){toast('Form saved');render();return}
  if(act==='close'){toast('Form saved');go('perf');return}
  if(act==='prev'){const r=SAP.formPrev(ME,fm.id);toast(r.ok?'Form sent back to '+fstep(fm).name:why(r));go('perf');return}
  const r=SAP.formNext(ME,fm.id);
  if(!r.ok){render();const x=document.getElementById('fready');if(x)x.scrollIntoView({block:'center'});toast(r.code==='SECTION'?tr('ready_bad',r.issues.length):why(r));return}
  toast(r.done?'Form completed':`Form sent to ${fstep(fm).name} · ${P[stepActor(fm)].name}`);go('perf')}
});
render();
</script>
</body>
</html>
